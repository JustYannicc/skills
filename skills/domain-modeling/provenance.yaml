schemaVersion: 1
strategy: adapted
sources:
  - id: matt-pocock-skills
retainedBehavior:
  - "Baseline is Matt Pocock's MIT-licensed `skills/engineering/domain-modeling/SKILL.md` at pinned revision `2ab958093e83e0ec752e6c1c5932da465bf23e0c`."
  - Active terminology work that challenges fuzzy or overloaded language instead of merely reading a glossary.
  - Concise canonical meanings with explicit aliases or avoided labels, recorded as terms crystallize.
  - Concrete scenario stress tests that expose boundaries and contradictions before accepting a meaning.
  - Updates to the canonical language record as meanings crystallize, with a bounded completion gate.
changedAssumptions:
  - A selected Adapter, not a repository root, CONTEXT.md path, or ADR directory, stores the canonical terminology record.
  - Technical code cross-reference is replaced by evidence-aware comparison of whatever authoritative artifacts, sources, observations, and practice the Coordination space exposes.
  - ADR creation and architectural trade-off decisions return to Workflow or their owning capability; this skill records terminology only.
  - Entries preserve aliases, conflicts, typed relationships, provenance, unresolved questions, and exact revisions without prescribing System Record serialization.
  - Technical, personal, organizational, physical, communicative, and agent contexts use the same terminology contract.
  - Missing Adapter capability enters visible Degraded mode and preserves a durable continuation rather than claiming a canonical write.
  - The skill joins the active Outcome and returns bounded evidence to Workflow; it never completes parent work.
