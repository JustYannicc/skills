schemaVersion: 1
strategy: adapted
sources:
  - id: thinking-in-systems-standard-v1
  - id: matt-pocock-skills
retainedBehavior:
  - Two-axis comparison of a submitted result with its governing standards and accepted Specification.
  - Risk-scaled independent review and concise findings at a public proof seam.
  - Revision-pinned evidence and a separate resolution path for material findings.
changedAssumptions:
  - Review is universal across code, communication, personal, organizational, physical, and agent results; code is one execution medium rather than a separate code-review workflow.
  - The accepted Specification, result, standards, effect evidence, and configured Supplemental findings are exact inputs, and one core Reviewer owns the integrated verdict.
  - Supplemental skills run only at the declared supplemental-review Extension point and strengthen rather than replace core Review.
  - Verified, Changes required, and Inconclusive return universal lifecycle transitions and responsibility to Workflow or the caller; Review never completes the parent Outcome or performs effects.
  - Missing, stale, conflicting, or changed evidence preserves state and produces an owned waiting path rather than an inferred pass.
