schemaVersion: 1
strategy: adapted
sources:
  - id: matt-pocock-skills
retainedBehavior:
  - Synthesize the current accepted context without conducting a fresh interview.
  - Use the surrounding domain vocabulary and preserve accepted decisions.
  - Carry the accepted problem, solution shape, behavior, decision, proof, and out-of-scope reasoning into one result.
  - Prefer one highest stable proof seam.
  - Return a complete specification boundary before downstream execution work.
changedAssumptions:
  - Replace repository, codebase, issue-tracker, PRD, user-story, and test-module assumptions with a universal Outcome contract.
  - Treat Inline accepted requests as valid semantic Specifications before a Persistence boundary.
  - Add explicit scope, exclusions, constraints, responsibility, authority, accepted decisions, unresolved exceptions, proof seam, and terminal condition.
  - Route material missing decisions to the discovery capability that owns the uncertainty instead of inventing them.
  - Make representation adapter-neutral and leave the System Record representation decision to its governing design.
  - Bind Specifications, approvals, evidence, and change impact to exact revisions without assuming a serialization.
