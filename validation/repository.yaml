schemaVersion: 2
skills:
  - name: implement
    provenance:
      strategy: adapted
      adaptationMode: universal-successor
      sources:
        - sourceId: matt-pocock-skills
          targets: [skills/engineering/implement/SKILL.md]
      retainedBehavior:
        - Execute accepted work from its governing Specification or Tickets rather than improvising a new contract.
        - Prove the result repeatedly at pre-agreed seams during execution and once at the complete result boundary.
        - Submit completed execution to Review instead of treating implementation activity as verification.
        - Preserve intentional versioning rather than handing off an accidental mutable latest state.
      changedAssumptions:
        - Replace software-only typechecking, test-suite, code-review, and Git-commit requirements with universal Proof seams, Evidence references, Review, and medium-appropriate exact Result revisions.
        - Admit only one accepted, unblocked, currently owned Ticket with verified Authority, dependencies, Proof seam, Specification revision, Ticket revision, and baseline Result revision.
        - Execute communication, organizational, physical, agent, software, and other bounded work through domain-appropriate capabilities without changing the universal Ticket contract.
        - Permit bounded delegated Executors while the Work owner retains Ticket Responsibility, validates child evidence, integrates one usable Result, and owns recovery.
        - Invoke only user-selected Supplemental skills configured at the governed `workflow.implementation` Extension point while Implement retains the Ticket Result and completion boundary.
        - Preserve failure as an event and waiting as owned Continuation state, including honest Degraded behavior when a required execution, proof, persistence, or Review capability is unavailable.
        - Separate preparation, approval, authorized effects, real-effect evidence, Review submission, Ticket completion, and parent Outcome completion.
        - Mint the immutable universal Result revision before Review so all proof, effects, and intake bind the same target; upstream performed code review before committing its final software revision.
        - Enable model invocation so Workflow can route accepted Tickets into Implementation automatically.
  - name: review
    provenance:
      strategy: original
  - name: prototype
    provenance:
      strategy: adapted
      adaptationMode: universal-successor
      sources:
        - sourceId: matt-pocock-skills
          targets:
            - skills/engineering/prototype/SKILL.md
            - skills/engineering/prototype/LOGIC.md
            - skills/engineering/prototype/UI.md
      retainedBehavior:
        - One explicit design question chooses the prototype shape.
        - The setup is throwaway from day one, trivial for its intended observer to exercise, isolated from live persistence by default, and explicit about relevant state.
        - The question, verdict, evidence, and disposable artifact are captured when they must persist, while validated decisions return to the owning workflow.
      changedAssumptions:
        - Prototype owns one reversible experiment across technical, personal, organizational, physical, communicative, and agent Systems instead of prescribing code-only logic and interface artifacts.
        - Universal experiment shapes replace framework, route, terminal, and implementation-specific instructions while preserving question-first branch selection.
        - The configured technical-prototype Supplemental Extension point may own bounded technical construction, while core Prototype retains the learning question, reversible boundary, evidence integration, verdict, disposition, and completion criterion.
        - Proof seams, Result revisions, Authority, Degraded mode, evidence delays, and live-effect boundaries follow the Thinking in Systems standard.
  - name: wayfinder
    provenance:
      strategy: adapted
      adaptationMode: universal-successor
      sources:
        - sourceId: matt-pocock-skills
          targets: [skills/engineering/wayfinder/SKILL.md]
      retainedBehavior:
        - Name the destination before charting the route and keep out-of-scope work distinct from in-scope fog.
        - Use a low-resolution Map as an index over canonical decision records rather than duplicating their detail.
        - Separate precise decision questions from not-yet-specifiable fog, then graduate fog only as the frontier sharpens.
        - Keep blockers, an unblocked decision frontier, bounded decision work, and cross-session continuation visible while planning remains distinct from destination execution.
      changedAssumptions:
        - Replace repository, issue-tracker, label, child-issue, assignee, branch, and fixed-session assumptions with adapter-neutral Outcome, Ticket, Claim, Evidence, and Continuation records.
        - Make Wayfinder model-invoked for persistent, multi-session, or irreducible fog and invoke companion capabilities only when their owned uncertainty is present.
        - Treat the Map as a derived navigation view while the selected Adapter preserves one writable canonical source for each decision and work record.
        - Support reducible, operating-delay, and irreducible fog through an operating Strategy with observation triggers, thresholds, safe modes, feedback, reversibility, recovery, ownership, and Authority.
        - Complete when the next route is truthfully specifiable or remaining fog is governed, rather than requiring every uncertainty or Ticket to disappear.
        - Make Git, hosted trackers, safe concurrency, and executable scheduling optional Adapter capabilities with visible Degraded behavior when absent.
  - name: thinking-in-systems
    provenance:
      strategy: adapted
      adaptationMode: suite-owned-synthesis
      sources:
        - sourceId: thinking-in-systems-standard-v1
          targets: [docs/source/THINKING_IN_SYSTEMS_STANDARD.md]
        - sourceId: matt-pocock-skills-thinking-in-systems-lineage
          targets:
            - skills/productivity/writing-great-skills/SKILL.md
            - skills/productivity/writing-great-skills/GLOSSARY.md
            - skills/engineering/tdd/SKILL.md
      retainedBehavior:
        - Complete approved universal systems method, preserved as the installed runtime reference.
        - Public-seam proof, progressive disclosure, and LLM-invocation patterns retained where compatible.
        - Public reference spine preserved as an installed concept-to-source guide without making evidence a second governing authority.
      changedAssumptions:
        - The later accepted suite boundary assigns coordination, equivalent fallback work, and phase results to the 'Workflow' skill or the caller; this skill returns their governing requirements and evidence obligations.
        - Technical, personal, organizational, physical, communicative, and agent systems share one proportional method.
        - A System may be one-time, recurring, or continuous; recurrence changes persistence and lifecycle obligations rather than admission to systems reasoning.
        - Thinking in Systems and the 'Workflow' skill are capability instructions composed by the same agent unless the active workflow explicitly delegates bounded work.
        - Known material Containing, Subsystem, Upstream, Dependent, Peer, and other relationships are indexed without duplicating their interface contracts.
        - Economics is a bounded design lens; Pareto concentration prioritizes search, Satisficing defines adequacy, Marginal analysis governs further effort, and Constraints, Preferences, Cost structure, substitution effects, and Externalities remain boundary- and evidence-aware.
        - Matched truthful Decision frames expose the stable judgment and frame-sensitive remainder without treating observed selection as stable Preference evidence or using framing to manufacture approval.
        - Activation begins an Assurance cadence whose verification, validation, burden, harm, and sustainment checks taper only after stable evidence or remain continuous when cheap and actionable.
  - name: workflow
    provenance:
      strategy: original
  - name: to-spec
    provenance:
      strategy: adapted
      adaptationMode: universal-successor
      sources:
        - sourceId: matt-pocock-skills
          targets: [skills/engineering/to-spec/SKILL.md]
      retainedBehavior:
        - Synthesize accepted context and decisions without opening a new discovery interview.
        - Preserve the surrounding domain vocabulary and accepted out-of-scope decisions.
        - Carry the accepted problem, solution shape, behavior, decisions, Proof seam, and exclusions into one Specification artifact.
        - Prefer one highest stable Proof seam and return a complete Specification boundary before downstream work.
      changedAssumptions:
        - Replace repository, codebase, issue-tracker, PRD, user-story, and test-module assumptions with a universal Outcome Specification template.
        - Treat a complete accepted low-risk request as an Inline Specification before a Persistence boundary.
        - Make scope, exclusions, Constraints, Responsibility, Authority, accepted decisions, unresolved exceptions, Proof seam, and terminal condition explicit.
        - Route material gaps to the discovery or approval capability that owns the uncertainty instead of inventing decisions.
        - Leave Durable representation to the selected Adapter and bind the resulting locator and exact revision when supplied.
        - Bind Specifications, approvals, evidence, and material-change impact to exact revisions while preserving unaffected accepted work.
        - Expose a specification-enrichment Extension point for configured Supplemental evidence while retaining the core Specification and acceptance boundary.
  - name: to-tickets
    provenance:
      strategy: adapted
      adaptationMode: universal-successor
      sources:
        - sourceId: matt-pocock-skills
          targets: [skills/engineering/to-tickets/SKILL.md]
      retainedBehavior:
        - Gather the accepted plan or Specification before decomposing work.
        - Prefer narrow, complete tracer-bullet or vertical-slice Tickets with an independently verifiable result.
        - Declare dependency edges so unblocked work forms a visible frontier.
        - Treat broad mechanical changes as an expand-migrate-contract sequence when a vertical slice cannot stay coherent.
        - Present granularity and dependency choices for the responsible owner to accept before publication.
      changedAssumptions:
        - Replace codebase, schema/API/UI/test-layer, issue-tracker, triage-label, and local-file assumptions with universal cross-domain Ticket contracts.
        - Start only from an accepted Specification and carry Result, owner, Authority, Proof seam, containment, requirements, and Workflow context in every Ticket.
        - Materialize Tickets only when delegation, dependencies, concurrency, cross-session work, meaningful risk, or another Persistence boundary warrants Durable coordination; a bounded Inline unit may remain implicit.
        - Use adapter-neutral `contains`, `requires`, and `related` relationships, with external dependencies represented by Continuation records rather than ownerless Tickets.
        - Prove collective coverage of accepted Specification requirements and return material gaps to Workflow without editing accepted intent.
        - Compute and expose the accepted Work frontier and Recovery queue without claiming, executing, reviewing, or completing the parent Outcome.
        - Add the configured `workflow.decomposition` (decomposition-enrichment) Supplemental Extension point with revision-bound evidence and advisory-versus-required failure behavior.
  - name: domain-modeling
    provenance:
      strategy: adapted
      adaptationMode: universal-successor
      sources:
        - sourceId: matt-pocock-skills-domain-modeling-lineage
          targets:
            - skills/engineering/domain-modeling/SKILL.md
            - skills/engineering/domain-modeling/CONTEXT-FORMAT.md
            - skills/engineering/domain-modeling/ADR-FORMAT.md
        - sourceId: matt-pocock-skills
          targets:
            - skills/engineering/domain-modeling/SKILL.md
            - skills/engineering/domain-modeling/CONTEXT-FORMAT.md
      retainedBehavior:
        - Active terminology work challenges fuzzy, overloaded, or conflicting language instead of merely reading a glossary.
        - Concise canonical meanings, aliases, and avoided labels are recorded as terms crystallize.
        - Concrete scenarios stress-test boundaries and contradictions before a meaning is accepted.
        - Authoritative artifacts and observed practice are cross-referenced against the proposed language.
        - The skill can join Grill With Docs when terminology and user-held decisions must be resolved together.
      changedAssumptions:
        - A selected Adapter, rather than a repository root or CONTEXT.md path, stores the canonical language record in its native representation.
        - Technical code cross-reference becomes evidence-aware comparison of authoritative artifacts, sources, observations, and practice in any supported domain.
        - ADR creation and architectural trade-off decisions return to 'Workflow' or their owning capability; this skill owns shared terminology only.
        - System relationships use the Thinking in Systems vocabulary while non-System concepts retain explicit domain relationships.
        - Semantic decision Authority accepts an exact terminology proposal separately from Adapter write Authority; either missing Authority keeps the result proposed or conflicted.
        - Decisive mutable evidence and language-record writes bind exact source revisions; stale evidence, partial sequential writes, or unavailable persistence produce visible recovery state instead of a claimed canonical update.
        - Configured terminology-evidence Supplemental skills contribute source-bound findings at a declared Extension point while Domain Modeling retains integration responsibility and its completion criterion.
        - The skill joins an active Outcome and returns bounded language evidence without completing the parent work.
