schemaVersion: 1
id: to-tickets-edge-supplemental
title: Configured decomposition evidence enriches without replacing the core result
shape: edge
kind: invocation
skill: to-tickets
domains: [technical, organizational]
severity: Major
requiredAttempts: 1
prompt: >-
  Decompose accepted Specification `inventory-cutover-r3` into Durable Tickets.
  The Outcome is a verified inventory migration for two warehouses with no
  stock loss. Configuration maps advisory Supplemental skill `risk-audit` to
  the `workflow.decomposition` decomposition-enrichment Extension point. After
  the first complete draft, invoke it with Specification revision `r3`, draft
  Ticket-set revision `tickets-d1`, warehouse constraints, dependency graph,
  and Proof obligations. It returns evidence `audit-r7` recommending no
  changes. Integrate that evidence, retain core collective acceptance, and
  return the accepted Ticket set without executing migration.
environment:
  id: workflow-to-tickets-supplemental-advisory
  capabilities:
    workflow: true
    persistence: true
    adapter: true
    to-tickets: true
    supplemental-skills: true
  tools: [selected canonical Adapter, configured risk-audit skill]
expected:
  actions: [bind accepted Specification revision, create complete draft Ticket set, invoke configured risk-audit at workflow.decomposition, bind audit-r7 to draft revision, rerun collective coverage and accept the core result]
  artifacts: [accepted Durable Ticket set, Supplemental evidence record]
  effects: []
  invoked: [to-tickets, risk-audit]
  notInvoked: [implement, migration effect, review]
  proof: [inventory-cutover-r3 and tickets-d1 are bound, risk-audit inspected the exact draft with warehouse constraints and dependency graph, audit-r7 proposes no change, core Ticket acceptance remains with To Tickets and Workflow]
  responsibility: [To Tickets retains decomposition and acceptance responsibility, risk-audit owns only advisory evidence, Outcome owner retains parent integration]
  route: [workflow-to-tickets-supplemental-to-workflow]
  state: [Accepted]
  forbidden: [invoke an unconfigured specialist, let risk-audit replace collective coverage, execute migration, transfer acceptance, claim parent completion]
