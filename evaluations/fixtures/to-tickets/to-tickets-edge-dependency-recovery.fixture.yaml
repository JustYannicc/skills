schemaVersion: 1
id: to-tickets-edge-dependency-recovery
title: External waits and cancelled prerequisites do not falsely unblock work
shape: edge
kind: invocation
skill: to-tickets
domains: [organizational, physical]
severity: Major
requiredAttempts: 1
prompt: >-
  Decompose accepted Specification `site-opening-r4`. The existing canonical
  Ticket set `site-opening-r4/ticket-set-r1` is already accepted. Ticket
  `T-SETUP` prepares an internal room and the permit condition waits for an
  external building permit that no Workflow Actor owns. Ticket `T-OPEN`
  requires both. The permit is
  currently waiting, and the internal setup Claim is stale; the Adapter cannot
  guarantee atomic concurrent claims. Show `T-OPEN` blocked, represent the
  permit as a Continuation rather than a fake Ticket, place stale setup work in
  Recovery, and declare sequential claiming until the Adapter capability is
  restored. A cancelled prerequisite must still be replaced, waived, or
  cancelled explicitly before `T-OPEN` can proceed.
environment:
  id: workflow-to-tickets-dependency-recovery
  capabilities:
    workflow: true
    persistence: true
    adapter: true
    atomic-claims: false
    to-tickets: true
  tools: [selected canonical Adapter]
expected:
  actions: [bind requires edges, represent external permit as Continuation, keep dependent Ticket blocked, place stale Claim in Recovery, declare concurrent claiming unsupported]
  artifacts: [Ticket dependency view, Continuation record, Recovery queue]
  effects: []
  invoked: [to-tickets]
  notInvoked: [implement, scheduler]
  proof: [site-opening-r4 is bound, T-OPEN remains blocked by the unwaived permit requirement, permit unblock condition and next check are recorded, stale T-SETUP Claim is Recovery work, Adapter limitation disables parallel claiming]
  responsibility: [T-OPEN owner retains responsibility while waiting, external permit has no invented Work owner, Recovery owner must resolve stale setup coordination]
  route: [workflow-to-tickets-recovery]
  state: [Accepted]
  forbidden: [create a fake permit Ticket, treat cancellation as satisfying requires, return stale active work to the Work frontier, claim atomic concurrency, execute effects]
