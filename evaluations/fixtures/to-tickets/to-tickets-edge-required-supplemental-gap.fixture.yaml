schemaVersion: 1
id: to-tickets-edge-required-supplemental-gap
title: Required Supplemental failure leaves decomposition waiting
shape: edge
kind: invocation
skill: to-tickets
domains: [physical, organizational]
severity: Major
requiredAttempts: 1
prompt: >-
  Decompose accepted Specification `lab-access-r6` for a physical access
  change. A required safety-review skill is configured at
  `workflow.decomposition`, but it is unavailable. Preserve the complete
  proposed Ticket set, exact Specification and draft revisions, the missing
  evidence, responsible owner, unblock condition, and exact resumption action.
  Do not accept, persist, or execute the Tickets until the required evidence
  returns.
environment:
  id: workflow-to-tickets-required-supplemental-gap
  capabilities:
    workflow: true
    persistence: true
    adapter: true
    to-tickets: true
    supplemental-skills: false
  tools: [selected canonical Adapter]
expected:
  actions: [create complete proposed draft, detect required workflow.decomposition mapping is unavailable, preserve exact revisions and missing proof, record owner and unblock condition, return Waiting state]
  artifacts: [proposed Ticket set, required-Supplemental capability gap and continuation]
  effects: []
  invoked: [to-tickets]
  notInvoked: [implement, safety effect]
  proof: [lab-access-r6 and draft Ticket-set revision are preserved, required safety-review evidence is named as missing, no Ticket is accepted or persisted as complete]
  responsibility: [To Tickets owns the proposed decomposition, configured required evidence remains a blocking dependency, Workflow coordinates restoration and resumption]
  route: [to-tickets-to-required-supplemental-wait]
  state: [Waiting]
  forbidden: [treat required Supplemental failure as advisory, accept or execute Tickets without required evidence, invent safety findings, claim parent completion]
