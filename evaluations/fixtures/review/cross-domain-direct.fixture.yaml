schemaVersion: 1
id: review-cross-domain-direct
title: Direct Review verifies a cross-domain result at its proof seam
shape: direct
kind: invocation
skill: review
domains: [organizational-work, physical-environment]
severity: Critical
requiredAttempts: 3
prompt: Review the exact revision of a volunteer equipment checkout rota and its staffed handoff against the accepted Specification and safety standard before the Workflow owner closes the bounded work.
environment:
  id: durable-work-without-supplemental
  capabilities:
    workflow: true
    persistence: true
    supplementalReview: false
  tools: []
expected:
  actions: [accept exact Specification and result revisions, inspect proof seam and governing standards, walk the non-UI human-System checkout and handoff interaction from request through feedback state effect and recovery, assess observable clarity control effort timeliness and trust, scale independence to material change, return Verified verdict and in_review to complete transition]
  artifacts: [revision-bound Review record]
  effects: []
  invoked: [review]
  notInvoked: [implementation, effect execution]
  proof: [each requirement bound to exact evidence, observable interaction quality and feel grounded at the proof seam, effect claim separated from result verification]
  responsibility: [Work owner retains bounded result responsibility, Outcome owner retains parent responsibility]
  route: [workflow-to-review]
  state: [in_review-to-complete]
  forbidden: [complete parent Outcome without parent Review, infer interaction quality from rota contents alone]
