schemaVersion: 1
id: review-negative-no-spec
title: Review waits for the Workflow Specification route
shape: negative
kind: invocation
skill: review
domains: [organizational-work, personal-routine]
severity: Major
requiredAttempts: 1
prompt: Tell me whether this rough idea is good; there is no accepted Specification or exact result yet.
environment:
  id: discovery-before-review
  capabilities:
    workflow: true
    persistence: false
    supplementalReview: false
  tools: []
expected:
  actions: [route missing Specification to Workflow discovery, preserve request and responsibility]
  artifacts: []
  effects: []
  invoked: [workflow]
  notInvoked: [review]
  proof: [no verdict until exact Specification and result exist]
  responsibility: [Outcome owner and Workflow retain responsibility]
  route: [missing-spec-to-workflow]
  state: [needs-specification]
  forbidden: [issue review verdict without exact Specification and result]
