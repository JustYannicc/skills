schemaVersion: 1
id: review-supplemental-advisory-absent
title: Advisory Supplemental absence degrades honestly
shape: edge
kind: composition
skill: review
domains: [communication, organizational-work]
severity: Major
requiredAttempts: 1
prompt: >-
  Review exact volunteer announcement result r12 against `announcement-spec@r3`
  and `public-comms@1.4`. Core evidence `announcement-check@r12-2` binds every
  Specification and Standards item to a passing observation. The user-selected
  `supplemental-review` mapping is `plain-language-review` from
  `public-skills@example.org/plain-language-review` version `2.1.0`, scoped to
  recipient comprehension, advisory, input contract `Specification + result +
  audience`, expected evidence `revision-bound reading observations`, failure
  behavior `record limitation and continue`; that capability is unavailable.
  Do not substitute any similar installed skill.
environment:
  id: core-review-with-advisory-gap
  capabilities:
    workflow: true
    persistence: false
    supplementalReview: false
  tools: []
expected:
  actions: [validate the exact selected mapping source version scope advisory status input evidence and failure behavior, record advisory capability gap, continue separate core Specification and Standards comparisons, return Verified when core proof passes]
  artifacts: [advisory limitation in Review record]
  effects: []
  invoked: [review]
  notInvoked: [undeclared specialist]
  proof: [mapping identity and result r12 remain visible, advisory absence does not alter core evidence]
  responsibility: [Outcome owner retains parent responsibility]
  route: [review-with-advisory-gap]
  state: [in_review-to-complete]
  forbidden: [pretend advisory skill ran, invoke an unmapped similar specialist]
