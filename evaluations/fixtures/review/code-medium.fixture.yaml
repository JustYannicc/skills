schemaVersion: 1
id: review-code-medium
title: Code is reviewed as one execution medium
shape: direct
kind: composition
skill: review
domains: [software, organizational-work]
severity: Major
requiredAttempts: 1
prompt: Review code revision r42 against the accepted data-export Specification and repository standards, with no bundled code-review replacement.
environment:
  id: code-without-code-review-companion
  capabilities:
    workflow: true
    persistence: true
    supplementalReview: false
  tools: [repository-read]
expected:
  actions: [compare code at the public proof seam, treat code as one execution medium, inspect Specification and governing standards, return Changes required with exact findings]
  artifacts: [changes-required Review record]
  effects: []
  invoked: [review]
  notInvoked: [bundled code-review skill]
  proof: [code behavior and Specification are compared at the accepted seam]
  responsibility: [Work owner resolves findings, Outcome owner integrates evidence]
  route: [universal-review]
  state: [in_review-to-accepted]
  forbidden: [claim tests alone prove parent completion]
