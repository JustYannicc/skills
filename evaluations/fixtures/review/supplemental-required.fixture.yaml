schemaVersion: 1
id: review-supplemental-required
title: Required Supplemental findings enrich the core verdict
shape: indirect
kind: routing
skill: review
domains: [software, physical-environment]
severity: Critical
requiredAttempts: 3
prompt: >-
  Workflow invokes Review for exact equipment-control result r8 against
  `control-spec@r5` and `equipment-safety@4.1`. The user-selected
  `supplemental-review` mapping is `public-safety-review` from
  `public-skills@example.org/public-safety-review` version `4.0.2`, scoped to
  lockout and recovery behavior, required, input contract `Specification + result
  + safety standard + proof seam`, expected evidence `revision-bound
  exercised-path observations`, failure behavior `return Inconclusive waiting`;
  invoke only this mapping at the declared extension point. The available mapped
  reviewer returns valid evidence `safety-review@r8-1`, explicitly bound to result
  r8, showing that recovery releases lockout before the safety acknowledgment and
  therefore violates `equipment-safety@4.1`. Integrate that finding into the core
  verdict without letting the Supplemental replace Review.
environment:
  id: workflow-with-required-supplemental
  capabilities:
    workflow: true
    persistence: true
    supplementalReview: true
  tools: [supplemental-reviewer]
expected:
  actions: [validate the exact selected mapping source version scope required status input evidence and failure behavior, run only that Supplemental at declared supplemental-review Extension point, validate Supplemental finding exact result revision, integrate finding into the applicable axis without replacing core Review, return Changes required transition]
  artifacts: [integrated Review record, Supplemental evidence reference]
  effects: []
  invoked: [workflow, review, configured Supplemental reviewer]
  notInvoked: [Supplemental verdict replacing core]
  proof: [mapping identity and Supplemental finding are bound to exact result r8 and visible in core evidence]
  responsibility: [Reviewer owns integrated verdict, Work owner resolves required changes, Outcome owner retains parent responsibility]
  route: [workflow-to-review-extension]
  state: [in_review-to-accepted]
  forbidden: [complete when required Supplemental evidence is stale, invoke an unmapped similar specialist]
