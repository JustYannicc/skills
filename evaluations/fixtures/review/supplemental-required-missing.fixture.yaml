schemaVersion: 1
id: review-supplemental-required-missing
title: Required Supplemental failure enters owned waiting
shape: incomplete
kind: routing
skill: review
domains: [physical-environment, software]
severity: Major
requiredAttempts: 1
prompt: >-
  Review exact equipment-layout result `r5` against accepted Specification
  `layout-spec@r2` and governing standard `site-safety@5.0` at Proof seam
  `site-walkthrough@r5-1`. The user-selected `supplemental-review` mapping is
  `public-safety-review` from
  `public-skills@example.org/public-safety-review` version `4.0.2`, scoped to
  trip and egress hazards, required, input contract `Specification + result +
  safety standard + site constraints`, expected evidence `revision-bound hazard
  observations`, failure behavior `wait without a verdict pass`; that capability
  is unavailable. Do not invoke or substitute any similar installed skill.
environment:
  id: workflow-with-required-supplemental-gap
  capabilities:
    workflow: true
    persistence: true
    supplementalReview: false
  tools: []
expected:
  actions: [admit and pin the exact Specification result standard and Proof seam, validate the exact selected mapping source version scope required status input evidence and failure behavior, preflight and detect the unavailable required capability without invoking it, record dependency and unblock condition, return Inconclusive waiting before discretionary core inspection]
  artifacts: [continuation record, required Supplemental gap]
  effects: []
  invoked: [review]
  notInvoked: [configured Supplemental reviewer, complete target, pretend required evidence exists]
  proof: [exact target and mapping identity remain visible, preflight failure blocks completion without Supplemental invocation, exact next check recorded]
  responsibility: [Work owner remains responsible, Outcome owner retains parent responsibility]
  route: [required-supplemental-to-waiting]
  state: [in_review-to-waiting]
  forbidden: [treat missing required Supplemental as advisory, invoke an unmapped similar specialist]
