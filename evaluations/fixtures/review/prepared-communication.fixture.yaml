schemaVersion: 1
id: review-prepared-communication
title: Prepared communication can be Verified before its effect
shape: edge
kind: composition
skill: review
domains: [communication, organizational-work]
severity: Major
requiredAttempts: 1
prompt: >-
  Review exact prepared result `customer-reply@r9` against accepted Specification
  `reply-spec@r4` and communication standard `customer-comms@2.3` before sending.
  The approved draft names the billing error, corrected amount and date, single
  recipient action, reply route when the correction is wrong, and two-business-day
  response expectation in plain language. Recipient rehearsal evidence
  `reply-rehearsal@r9-1` found the flow clear, coherent, respectful, low-effort,
  trustworthy, and recoverable, with every Specification and Standards item
  passing. The draft is approved but has not been sent. Verify the result seam
  without claiming delivery.
environment:
  id: prepared-communication-before-effect
  capabilities:
    workflow: true
    persistence: true
    scheduling: false
  tools: []
expected:
  actions: [identify result-level proof seam, verify prepared exact revision, assess the recipient interaction for clarity coherence effort tone trust and recovery instructions using observable message evidence, record pending effect without claiming delivery, return Verified for the result seam]
  artifacts: [revision-bound Review record]
  effects: []
  invoked: [review]
  notInvoked: [send message, claim delivery]
  proof: [message content matches Specification, interaction quality and feel are evidenced separately under Standards, pending effect is explicit]
  responsibility: [Work owner retains effect responsibility, Outcome owner retains parent responsibility]
  route: [prepared-result-review]
  state: [in_review-to-complete]
  forbidden: [treat prepared draft as sent or parent Outcome complete, equate polished wording with successful delivery]
