schemaVersion: 1
id: review-maintainability-cross-domain
title: Maintainability applies to a non-software operating result
shape: indirect
kind: composition
skill: review
domains: [organizational-work, physical-environment]
severity: Major
requiredAttempts: 1
prompt: Workflow asks Review to verify exact revision ops-r6 of a community kitchen closing procedure against Specification spec-r3 and the facility standard. Assess whether the next shift lead can safely understand, change, operate, support, and recover it without hidden knowledge.
environment:
  id: maintainable-operating-procedure
  capabilities:
    workflow: true
    persistence: true
    supplementalReview: false
  tools: [procedure-record, rehearsal-notes]
expected:
  actions: [pin exact target and standards revisions, compare Specification and Standards separately, inspect source of truth boundaries complexity dependencies rationale ownership operating burden degradation recovery and legacy disposition, evaluate from the future responsible Actor perspective, return Changes required for hidden recovery knowledge]
  artifacts: [revision-bound Review record, maintainability finding]
  effects: []
  invoked: [workflow, review]
  notInvoked: [software-only code review]
  proof: [rehearsal evidence shows the next shift lead cannot recover without an unrecorded current-owner intervention]
  responsibility: [Work owner records and retests recovery, Outcome owner retains parent responsibility]
  route: [workflow-to-universal-maintainability-review]
  state: [in_review-to-accepted]
  forbidden: [treat maintainability as software-only, accept current-owner familiarity as future-operability proof]
