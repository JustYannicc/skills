schemaVersion: 1
id: batch-grill-me-negative
title: A bounded correction does not become a decision interview
shape: negative
kind: invocation
skill: batch-grill-me
domains: [communication]
severity: Major
requiredAttempts: 1
prompt: >-
  Correct the typo in this sentence: "The parcel arrived tomorow."
environment:
  id: trivial-correction
  capabilities:
    directFactLookup: false
    delegation: false
    persistence: false
  tools: []
expected:
  actions: [return the corrected sentence]
  artifacts: []
  effects: [corrected sentence returned]
  invoked: []
  notInvoked: [batch-grill-me, decision-frontier interview]
  proof: [the returned sentence is checked against the requested correction]
  responsibility: [the active workflow retains responsibility for the bounded correction]
  route: [inline-correction]
  state: [complete]
  forbidden: [invent a design tree, ask unrelated questions, wait for shared-understanding confirmation]
