schemaVersion: 1
id: batch-grill-me-indirect
title: Workflow receives the completed Batch Grill Me frontier result
shape: indirect
kind: invocation
skill: batch-grill-me
domains: [agent-work, communication]
severity: Major
requiredAttempts: 1
prompt: >-
  Workflow is coordinating a recurring customer-update process. Batch Grill Me
  has already asked its complete first frontier, and the user explicitly
  accepted these answers: audience is active customers who opted into service
  updates; cadence is weekly on Tuesday at 09:00 UTC; and the operations lead
  approves the exact draft revision. The next frontier was channel and template,
  which depend on audience; cancellation rules, which depend on cadence; and
  escalation rules, which depend on approval. The user then accepted email, a
  concise status-and-actions template, cancellation at least 24 hours before
  the send, and escalation to the operations director. The user confirms this
  is the complete shared understanding and the frontier is empty. Return that
  exact completed decision result to Workflow without writing a Specification
  or sending an update.
environment:
  id: workflow-with-user-decisions
  capabilities:
    directFactLookup: true
    delegation: false
    persistence: true
  tools: [workflow-record]
expected:
  actions: [recognize the explicitly accepted user decisions across both dependency rounds, confirm the decision frontier is empty and shared understanding is explicit, return the user's exact completed decision result to Workflow]
  artifacts: [decision-frontier result]
  effects: []
  invoked: [batch-grill-me]
  notInvoked: [Specification creation, message sending]
  proof: [Workflow receives the exact answered decisions their dependency order and an empty confirmed frontier]
  responsibility: [Workflow retains parent responsibility while Batch Grill Me owns only the bounded decision-frontier result]
  route: [workflow-to-batch-grill-me-to-workflow]
  state: [ready-for-workflow]
  forbidden: [complete the parent Outcome, leave an accepted decision out of the result, create the Specification, send customer updates]
