schemaVersion: 1
id: batch-grill-me-direct-fact-path
title: Available factual legwork is completed directly before the frontier is asked
shape: edge
kind: invocation
skill: batch-grill-me
domains: [physical-environment, organizational-work]
severity: Major
requiredAttempts: 1
prompt: >-
  Help set the attendance rules for a North Hall workshop. The accepted current
  frontier has exactly two independent user decisions: whether registration is
  public or members-only, and whether the attendance cap should equal the
  permitted occupancy or use a lower safety margin. The second decision requires
  the current permitted-occupancy fact. Inspect
  `evaluations/inputs/batch-grill-me/north-hall-capacity.txt` directly with the
  available filesystem capability, state the fact and source revision, then ask
  both now-unblocked decisions together with a recommendation for each. Do not
  ask me to inspect the record, and wait for my decisions before advancing.
environment:
  id: direct-fact-capability
  capabilities:
    directFactLookup: true
    delegation: false
    persistence: false
  tools: [filesystem]
expected:
  actions: [inspect the supplied facility record directly, state the permitted-occupancy fact and source revision, ask both now-unblocked user decisions together with recommendations, wait for the user's decisions before advancing]
  artifacts: [direct fact result, complete current decision frontier]
  effects: []
  invoked: [batch-grill-me]
  notInvoked: [delegated fact-finding, attendance-rule execution]
  proof: [the directly inspected capacity fact unlocks the attendance-cap decision without user-assigned legwork]
  responsibility: [batch-grill-me retains the interview while the user retains both decisions]
  route: [direct-fact-to-decision-frontier]
  state: [waiting-for-user-decisions]
  forbidden: [ask the user to inspect the facility record, invent a capacity value, leave the attendance-cap branch blocked after direct inspection, act on the attendance rules]
