schemaVersion: 1
id: batch-grill-me-delegated-fact-path
title: Bounded delegation preserves the rest of the frontier while a fact is gathered
shape: edge
kind: invocation
skill: batch-grill-me
domains: [physical-environment, organizational-work]
severity: Major
requiredAttempts: 1
prompt: >-
  Help plan a workshop at River Hall. The accepted current frontier has exactly
  two independent user decisions: workshop date and maximum venue budget. A
  later accessibility-threshold decision depends on the current River Hall
  step-free-entry policy. This context cannot inspect files directly but can
  delegate. Dispatch a bounded fact-finding task to inspect
  `evaluations/inputs/batch-grill-me/river-hall-accessibility.txt`, requiring the
  exact policy, revision, source locator, and return route. Ask the date and
  budget decisions together now with recommendations while that fact task is an
  unsettled prerequisite. Integrate the returned fact, preserve the
  accessibility decision for the next recomputed frontier, and wait for my
  current-round answers. Do not ask me to inspect the record.
environment:
  id: delegated-fact-capability
  capabilities:
    directFactLookup: false
    delegation: true
    persistence: false
  tools: [delegation]
expected:
  actions: [dispatch a bounded fact-finding task with source and return contract, ask the independent date and budget decisions together while fact-finding is unsettled, integrate the returned policy fact, preserve the accessibility decision for the next recomputed frontier, wait for the user's current-round decisions]
  artifacts: [bounded delegated fact result, partial current decision frontier]
  effects: []
  invoked: [batch-grill-me, delegated fact-finding]
  notInvoked: [venue booking, accessibility decision]
  proof: [the delegated result includes exact policy revision source locator and return route while independent questions do not block]
  responsibility: [batch-grill-me retains the interview and integrates the bounded delegated result]
  route: [delegated-fact-with-concurrent-frontier]
  state: [waiting-for-user-decisions]
  forbidden: [ask the user to inspect the policy, fabricate the policy result, block the independent frontier on delegated fact-finding, ask the accessibility decision before the fact returns, book the venue]
