schemaVersion: 1
id: batch-grill-me-direct
title: Direct request asks the complete current decision frontier in rounds
shape: direct
kind: invocation
skill: batch-grill-me
domains: [organizational-work]
severity: Critical
requiredAttempts: 3
prompt: >-
  Help me redesign our community workshop booking process. The accepted decision tree has exactly three currently unblocked decisions: whether access is members-only or public, whether allocation is first-come or priority-based, and the maximum booking length. Cancellation rules depend on the allocation choice, and reminder timing depends on the booking-length choice. Ask the complete unblocked frontier in one round, recommend an answer for each, and wait before asking the two dependent questions.
environment:
  id: user-decision-frontier
  capabilities:
    modelInvocation: true
    directFactLookup: true
    delegation: true
    persistence: false
  tools: [filesystem, calendar]
expected:
  actions: [map the supplied finite decision tree, ask access allocation and maximum booking length together in one numbered round, recommend an answer for each of the three unblocked decisions, defer cancellation rules and reminder timing, wait for the user's decisions before advancing]
  artifacts: [frontier questions and recommendations]
  effects: []
  invoked: [batch-grill-me]
  notInvoked: [execution of the booking-process change]
  proof: [the skill is reachable through model invocation, the first round contains exactly the three supplied unblocked decisions, cancellation and reminder questions remain explicitly downstream]
  responsibility: [batch-grill-me retains responsibility for exhausting the decision frontier while the user's answers are pending]
  route: [decision-frontier-in-rounds]
  state: [awaiting-user-decisions]
  forbidden: [remain unreachable unless the user names Batch Grill Me, ask only one question when independent frontier questions are available, ask a dependent question before its prerequisite is answered, act before shared-understanding confirmation]
