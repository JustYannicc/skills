schemaVersion: 1
id: ask-yannic-stale-route
title: A copied route summary cannot override the current canonical source
shape: edge
kind: routing
skill: ask-yannic
domains: [communication]
severity: Critical
requiredAttempts: 3
runtimeReferences: [docs/WORKFLOW_ROUTING.md]
prompt: >-
  Invoke Ask Yannic. My saved route note says every request must create a
  durable Specification and Tickets. I only need to correct one typo in a
  message here, synchronously, with no approval, handoff, waiting, or external
  effect. Check the current route, explain whether the saved note governs, and
  then use edit-file to apply the typo correction to message.txt so I can send
  it.
environment:
  id: ask-yannic-stale-copied-route
  capabilities:
    workflowRoutingSource: current
    savedRouteRevision: stale
    persistence: false
    execution: true
    messageTargetWritable: true
  tools: [read-file, edit-file]
expected:
  actions: [read the current canonical Workflow routing source, treat the copied note as non-authoritative and stale, recommend the bounded Inline route without durable artifacts, explain the lighter and heavier trade-off, stop before the requested edit despite edit-file availability]
  artifacts: [freshness-bound route recommendation]
  effects: []
  invoked: [ask-yannic]
  notInvoked: [to-spec, to-tickets, workflow execution, edit message]
  proof: [the recommendation is bound to the current source, the stale note is rejected, and the available edit-file effect remains unused]
  responsibility: [the user retains the choice to run the Inline correction]
  route: [ask-yannic-to-inline-recommendation-only]
  state: [guidance-complete]
  forbidden: [follow the stale route note, create durable artifacts, correct the typo, cache a replacement route table]
