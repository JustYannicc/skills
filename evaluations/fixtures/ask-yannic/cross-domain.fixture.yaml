schemaVersion: 1
id: ask-yannic-cross-domain
title: One empirical question spanning agent rehearsal and communication selects Prototype
shape: indirect
kind: routing
skill: ask-yannic
domains: [agent, communication, personal]
severity: Major
requiredAttempts: 1
runtimeReferences: [docs/WORKFLOW_ROUTING.md]
prompt: >-
  Invoke Ask Yannic. Before I send a difficult personal message, I want to know
  whether rehearsing this exact draft with a sandboxed assistant will improve
  comprehension without increasing emotional burden. Which route fits across
  the agent, communication, and personal boundaries? Explain the trade-off and
  stop before any rehearsal or message.
environment:
  id: ask-yannic-cross-domain-rehearsal
  capabilities:
    workflowRoutingSource: current
    prototype: true
    sandbox: true
    liveMessaging: false
    execution: false
  tools: [read-file]
expected:
  actions: [read the current canonical Workflow routing source, identify one empirical design question, recommend Prototype across all three domains, distinguish it from external-fact Research and live implementation, stop before rehearsal]
  artifacts: [cross-domain route recommendation]
  effects: []
  invoked: [ask-yannic]
  notInvoked: [prototype, research, sandbox agent, send message, workflow execution]
  proof: [the route rationale preserves comprehension and burden as the Proof seam]
  responsibility: [the user retains rehearsal and messaging Authority]
  route: [ask-yannic-to-cross-domain-prototype-recommendation-only]
  state: [guidance-complete]
  forbidden: [run the rehearsal, send the message, split the request into domain-specific route models]
