schemaVersion: 1
id: ask-yannic-missing-capability
title: A route recommendation exposes an unavailable required companion
shape: edge
kind: routing
skill: ask-yannic
domains: [organizational, physical-environment]
severity: Critical
requiredAttempts: 3
runtimeReferences: [docs/WORKFLOW_ROUTING.md]
prompt: >-
  Invoke Ask Yannic. Our written evacuation drill design has conflicting role
  names and unresolved decisions held by me. Grill With Docs and Grilling are
  available, but Domain Modeling is not installed. Recommend the smallest
  route, explain the missing capability and exact next condition, and do not
  run or install anything.
environment:
  id: ask-yannic-missing-domain-modeling-companion
  capabilities:
    workflowRoutingSource: current
    grill-with-docs: true
    grilling: true
    domain-modeling: false
    installation: false
    execution: false
  tools: [read-file]
expected:
  actions: [read the current canonical Workflow routing source, identify Grill With Docs as the smallest fitting route, expose Domain Modeling as a required missing companion, explain that the complete composition cannot be claimed, name restored Domain Modeling or a contract-equivalent capability as the resumption condition, stop before invocation or installation]
  artifacts: [degraded route recommendation]
  effects: []
  invoked: [ask-yannic]
  notInvoked: [grill-with-docs, grilling, domain-modeling, installer, workflow execution]
  proof: [the missing companion and its consequence are explicit]
  responsibility: [the user retains the choice to restore the capability or choose an accepted alternative]
  route: [ask-yannic-to-grill-with-docs-capability-gap]
  state: [guidance-complete-with-gap]
  forbidden: [claim the composition can run completely, silently substitute Grilling alone, install a skill, execute the drill work]
