schemaVersion: 1
id: ask-yannic-incomplete
title: Material ambiguity yields one discriminating question instead of a guessed route
shape: incomplete
kind: routing
skill: ask-yannic
domains: [organizational]
severity: Major
requiredAttempts: 1
runtimeReferences: [docs/WORKFLOW_ROUTING.md]
prompt: >-
  Invoke Ask Yannic. We need to decide whether a new on-call rotation will
  work. I do not know whether the blocker is evidence about established
  industry practice or evidence from trying our specific rotation. Tell me
  which route to use, but do not start it.
environment:
  id: ask-yannic-ambiguous-evidence-source
  capabilities:
    workflowRoutingSource: current
    research: true
    prototype: true
    execution: false
  tools: [read-file]
expected:
  actions: [read the current canonical Workflow routing source, preserve both materially plausible routes, ask whether the decision needs external facts or an empirical verdict about this design, stop before invocation]
  artifacts: [source-derived branching recommendation]
  effects: []
  invoked: [ask-yannic]
  notInvoked: [research, prototype, workflow execution]
  proof: [one discriminating question separates Research from Prototype]
  responsibility: [the user retains the missing decision and next invocation]
  route: [ask-yannic-discriminating-question]
  state: [guidance-waiting-on-answer]
  forbidden: [guess the evidence type, invoke either route, expand into a planning interview]
