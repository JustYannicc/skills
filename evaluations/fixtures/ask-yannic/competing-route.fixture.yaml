schemaVersion: 1
id: ask-yannic-competing-route
title: Documented design with terminology and user decisions selects one composition route
shape: direct
kind: routing
skill: ask-yannic
domains: [organizational, physical-environment]
severity: Critical
requiredAttempts: 3
runtimeReferences: [docs/WORKFLOW_ROUTING.md]
prompt: >-
  Invoke Ask Yannic. I have a written redesign for our community kitchen's
  volunteer handoff. The document uses "shift owner" inconsistently and I
  still hold two decisions about escalation and closing checks. Should I use
  Domain Modeling, Grilling, Grill With Docs, or Wayfinder? Recommend the
  smallest applicable route, explain its trade-off and required capabilities,
  and stop before running anything.
environment:
  id: ask-yannic-documented-kitchen-design
  capabilities:
    workflowRoutingSource: current
    grill-with-docs: true
    grilling: true
    domain-modeling: true
    wayfinder: true
    execution: false
  tools: [read-file]
expected:
  actions: [read the current canonical Workflow routing source, compare the competing routes against the stated uncertainty, recommend Grill With Docs as the smallest applicable composition, explain why separate or heavier routes add cost, disclose the companion capabilities, stop before invocation]
  artifacts: [source-derived route recommendation]
  effects: []
  invoked: [ask-yannic]
  notInvoked: [grill-with-docs, grilling, domain-modeling, wayfinder, workflow execution]
  proof: [the recommendation identifies the canonical source and separates advice from execution]
  responsibility: [the user retains the decision to invoke the recommended route]
  route: [ask-yannic-to-grill-with-docs-recommendation-only]
  state: [guidance-complete]
  forbidden: [maintain an independent route table, invoke a recommended skill, edit the kitchen design, infer coworker-facing Yannic judgment]
