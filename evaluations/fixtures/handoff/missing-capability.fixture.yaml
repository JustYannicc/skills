schemaVersion: 1
id: handoff-missing-capability
title: Missing continuation capabilities produce a portable Degraded Handoff
shape: incomplete
kind: invocation
skill: handoff
domains: [personal, agent]
severity: Major
requiredAttempts: 1
prompt: >-
  Preserve my apartment move coordination for another session. The accepted
  checklist is `move-plan-r2`; utility cancellation is waiting on the final
  meter reading, and box labeling is the next unblocked work.
environment:
  id: handoff-no-persistence-or-continuation-capability
  capabilities: {workflow: true, persistence: false, handoff: true, communication: false, scheduling: false, automatic-resumption: false}
  tools: []
expected:
  actions: [classify same-owner Continuity, expose a portable inline Handoff, reference move-plan-r2, disclose every missing guarantee, preserve manual pickup and current owner, return exact resumption action]
  artifacts: [inline portable Handoff package]
  effects: []
  invoked: [workflow, handoff]
  notInvoked: [file write, message, scheduler, monitor]
  proof: [meter-reading dependency survives, box-labeling remains the next frontier, manual user-carried pickup is the return route, persistence remains unverified, resumption remains manual]
  responsibility: [same owner remains responsible, Workflow receives the degraded continuation]
  route: [workflow-to-handoff-degraded-to-workflow]
  state: [Degraded, continuation unverified, parent Outcome open]
  forbidden: [claim a durable write, claim future resumption, claim monitoring, invent a recipient, transfer Responsibility, drop the waiting dependency, complete the move]
