schemaVersion: 1
id: handoff-session-continuity
title: Same-owner Continuity preserves current canonical state
shape: edge
kind: invocation
skill: handoff
domains: [agent, communication]
severity: Major
requiredAttempts: 1
prompt: >-
  I am ending this session and will continue the same owned translation update
  in a fresh session tomorrow. The canonical work is `translation-update-r6`,
  two reviewer questions remain, and the exact pickup point is the second
  paragraph of the response draft at `draft-r3`. Create same-owner Continuity; I
  remain responsible.
environment:
  id: handoff-session-same-owner
  capabilities: {workflow: true, persistence: true, adapter: true, handoff: true, automatic-resumption: false}
  tools: [selected canonical Adapter]
expected:
  actions: [classify Continuity rather than Transfer, bind canonical revisions and pickup point, persist a manual next-session trigger, require current-state reread on pickup, return continuation evidence]
  artifacts: [Continuity Handoff contract]
  effects: []
  invoked: [workflow, handoff]
  notInvoked: [scheduler, implement]
  proof: [translation-update-r6 and draft-r3 are exact references, reviewer questions and first next action survive, fresh session must reread current state]
  responsibility: [same owner remains responsible across sessions, Workflow retains parent integration]
  route: [workflow-to-handoff-continuity-to-workflow]
  state: [Prepared, parent Outcome open]
  forbidden: [invent a successor, claim automatic resumption, infer acceptance from the new session, duplicate the draft, complete the translation update]
