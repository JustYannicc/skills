schemaVersion: 1
id: handoff-rejected-transfer
title: Rejected Transfer leaves the outgoing owner responsible
shape: edge
kind: invocation
skill: handoff
domains: [organizational]
severity: Critical
requiredAttempts: 3
prompt: >-
  I offered Handoff `rotation-r7` for the on-call coordination Outcome to Mina.
  Mina explicitly rejected it because the escalation Authority is missing. The
  current on-call lead is still reachable. Record the correct Handoff state and
  recovery path.
environment:
  id: handoff-explicit-rejection
  capabilities: {workflow: true, persistence: true, adapter: true, handoff: true, recipient-return-route: true}
  tools: [selected canonical Adapter, recipient response record]
expected:
  actions: [verify rejection against rotation-r7, record Rejected without ownership transition, preserve outgoing owner and state, expose missing escalation Authority, return retry revision escalation or alternate-successor options to Workflow]
  artifacts: [append-only rejection disposition, recovery continuation]
  effects: []
  invoked: [workflow, handoff]
  notInvoked: [ownership transfer, authority grant, cancellation, parent completion]
  proof: [Mina response binds rotation-r7, missing Authority remains visible, current on-call lead and exact recovery action remain explicit]
  responsibility: [current on-call lead remains Outcome owner, Mina accepts no Responsibility, Workflow coordinates recovery]
  route: [workflow-to-handoff-recovery-to-workflow]
  state: [rejected, Recovery, parent Outcome active]
  forbidden: [treat rejection as transfer, infer Authority, leave work ownerless, hide the failed offer, complete or cancel the Outcome]
