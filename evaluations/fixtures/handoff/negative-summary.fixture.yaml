schemaVersion: 1
id: handoff-negative-summary
title: Ordinary summarization does not invoke Handoff
shape: negative
kind: invocation
skill: handoff
domains: [communication]
severity: Major
requiredAttempts: 1
prompt: >-
  Summarize these meeting notes into five bullets for the same attendees. No
  work, owner, session, waiting state, service boundary, or operating context is
  changing.
environment:
  id: handoff-negative-summary-only
  capabilities: {workflow: true, handoff: true}
  tools: []
expected:
  actions: [route to ordinary bounded summarization]
  artifacts: [five-bullet summary]
  effects: []
  invoked: [workflow]
  notInvoked: [handoff]
  proof: [the requested summary is returned without a Handoff contract]
  responsibility: [existing responsibility remains unchanged]
  route: [workflow-inline-summary]
  state: [inline result]
  forbidden: [create a successor, request acceptance, materialize durable continuation, claim ownership transfer]
