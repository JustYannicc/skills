schemaVersion: 1
id: grilling-edge-delegated-fact
title: A delegated fact branch does not block independent decisions
shape: edge
kind: composition
skill: grilling
domains: [physical-systems]
severity: Major
requiredAttempts: 1
prompt: >-
  Grill me on changing warehouse dispatch cutoffs. Carrier pickup times are a
  fact in evaluations/inputs/grilling/carrier-pickups.json, but direct
  environment inspection is unavailable; an approved bounded delegation may
  read it. Cutoff-time questions depend on that fact. The two independent user
  decisions are which customer promise to publish and which role owns dispatch
  exceptions. Start the fact legwork and ask the independent frontier now.
environment:
  id: warehouse-frontier-with-delegated-fact
  capabilities:
    grilling: true
    direct-environment-inspection: false
    approved-delegation: true
  tools: [bounded fixture fact delegation]
expected:
  actions: [delegate only the carrier-pickup file read with its source and return route explicit, hold cutoff-time questions, ask both independent decisions now with recommendations]
  artifacts: []
  effects: [one bounded child fact read]
  invoked: [grilling, approved fact delegation]
  notInvoked: [implementation]
  proof: [a real bounded child call and result trace identifies the file revision and hash, only fact-dependent questions wait]
  responsibility: [Grilling retains the frontier while the user owns decisions and the child result has an explicit return route]
  route: [grilling-frontier-with-fact-legwork]
  state: [waiting-for-user-decisions-and-fact-integration]
  forbidden: [ask the user for carrier pickup times, block either independent decision, ask a cutoff-time question before integrating the fact]
