schemaVersion: 1
id: grilling-direct-frontier-format
title: Direct Grilling asks the exact complete unblocked frontier
shape: direct
kind: invocation
skill: grilling
domains: [organizational-work]
severity: Critical
requiredAttempts: 3
prompt: >-
  Grill me on a community workshop schedule. Exactly two decisions are
  unblocked now: choose Saturday, Sunday, or both for weekend opening; and
  choose 20:00 or 22:00 for weekday closing. Staffing depends on the weekend
  choice, and keyholder coverage depends on the weekday close, so those two
  dependent questions are not answerable yet. Ask the whole current frontier,
  recommend one answer for each, and do not act on the plan.
environment:
  id: workshop-two-question-frontier
  capabilities:
    grilling: true
  tools: []
expected:
  actions: [ask both and only the two declared unblocked decisions in one round, format every question as a numbered question line followed by a recommendation line, defer staffing and keyholder questions, wait for the user's decisions]
  artifacts: []
  effects: []
  invoked: [grilling]
  notInvoked: [implementation]
  proof:
    - 'each question uses the literal form "❓ **Qn** - **<title>**: <body>" followed by "➡️ <recommended answer>"'
    - the round contains exactly two questions
  responsibility: [the user owns both decisions and the requesting context owns later action]
  route: [grilling-frontier]
  state: [waiting-for-frontier-answers]
  forbidden: [ask a dependent staffing or keyholder question, answer a user-owned decision, act on the plan]
