schemaVersion: 1
id: grilling-indirect-agent-fact
title: Workflow invokes Grilling and the agent reads available facts
shape: indirect
kind: routing
skill: grilling
domains: [software]
severity: Critical
requiredAttempts: 3
prompt: >-
  Workflow is preparing notification settings and needs the decision frontier
  resolved before Specification. First read
  evaluations/inputs/grilling/notification-settings.json. The two open user
  decisions are whether SMS requires explicit opt-in and whether users may set
  a per-event channel instead of the system default. Quiet-hour behavior
  depends on opt-in, and retry behavior depends on per-event selection. Use the
  bounded interview capability and return shared understanding to Workflow.
environment:
  id: workflow-notification-settings
  capabilities:
    workflow: true
    grilling: true
    environment-inspection: true
  tools: [fixture file read]
expected:
  actions: [invoke Grilling from Workflow, read and report revision 2026-08-01 with enabled channels email and sms and default email, ask both and only the two open user decisions with the exact numbered question and recommendation format, defer quiet-hour and retry questions]
  artifacts: []
  effects: [read the declared fixture file only]
  invoked: [workflow, grilling]
  notInvoked: [Specification, implementation]
  proof: [a real file-read trace and source hash support the facts, both questions use the literal Grilling format]
  responsibility: [Workflow retains parent responsibility and the user retains decision authority]
  route: [workflow-to-grilling]
  state: [waiting-for-frontier-answers]
  forbidden: [ask the user which channels or default are configured, ask either dependent question, continue into Specification]
