schemaVersion: 1
id: domain-modeling-system-relationships-technical
title: System relationships retain Thinking in Systems meanings
shape: edge
kind: invocation
domains: [technical]
severity: Major
requiredAttempts: 1
prompt: >-
  Accepted boundary records commerce-platform@boundary-r14, checkout@boundary-r9, fraud-screening@boundary-r6, and billing@boundary-r11 establish Checkout as the System of interest inside Commerce Platform, Fraud Screening inside Checkout, and Billing inside Commerce Platform supplying payment authorization to Checkout. Language steward Imani accepted relationship proposal system-language-p7 from those records. Record the relationship language without making an architecture decision.
environment:
  id: adapter-system-relationships
  capabilities:
    persistence: true
    conditionalWrite: true
    nativeLanguageRecord: true
    semanticDecisionAuthority: true
    writeAuthority: true
    thinkingInSystemsRelationshipAuthority: true
  tools: [selected Adapter with native language-record shape at language-r18, Imani acceptance of proposal system-language-p7, commerce-platform@boundary-r14, checkout@boundary-r9, fraud-screening@boundary-r6, billing@boundary-r11, Thinking in Systems governing standard]
expected:
  actions: [select the System of interest, bind accepted boundary record locators and revisions, apply authoritative Thinking in Systems relationship meanings, stress-test containment and dependency direction, bind semantic acceptance to the exact proposal revision, record canonical relationship terms]
  artifacts: [Adapter-native relationship entries using Thinking in Systems vocabulary]
  effects: [shared System relationship language available to Workflow]
  invoked: [thinking-in-systems, workflow, domain-modeling]
  notInvoked: [architecture decision, implementation, to-spec]
  proof: [commerce-platform@boundary-r14 checkout@boundary-r9 fraud-screening@boundary-r6 and billing@boundary-r11 retained, Commerce Platform identified as Containing System, Fraud Screening identified as Subsystem, Billing identified as both Peer System and Upstream System, dependency direction remains explicit, Imani acceptance of system-language-p7 and Adapter result revisions]
  responsibility: [domain-modeling owns the bounded language result, workflow retains parent responsibility]
  route: [workflow-to-domain-modeling]
  state: [system-relationships-recorded]
  forbidden: [replace the System relationships with contains requires or related record relationships]
