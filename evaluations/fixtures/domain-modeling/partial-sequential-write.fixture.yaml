schemaVersion: 1
id: domain-modeling-partial-sequential-write
title: Independent sequential entries preserve partial commit recovery
shape: edge
kind: routing
domains: [nontechnical]
severity: Major
requiredAttempts: 1
prompt: Garden language steward Mina accepted two independent entries in proposal garden-language-p8 from garden-handbook@handbook-r12 and rota-form@form-r4. The Adapter cannot batch. The first write guarded at language-r20 succeeds as entry garden-term-31 at language-r21; an external update advances the record to language-r22 before the second write. Preserve exact partial state and recovery.
environment:
  id: sequential-adapter-partial-failure
  capabilities:
    persistence: true
    conditionalWrite: true
    batchWrite: false
    semanticDecisionAuthority: true
    writeAuthority: true
  tools: [selected Adapter, Mina acceptance of proposal garden-language-p8, garden-handbook@handbook-r12, rota-form@form-r4]
expected:
  actions: [verify the entries are independent, write the first entry with an exact guard, reread the language-record guard, stop when the second guard is stale, preserve committed and uncommitted entries separately, return exact recovery action]
  artifacts: [partial terminology update record]
  effects: [first independent entry committed]
  invoked: [thinking-in-systems, workflow, domain-modeling]
  notInvoked: [forced second write, aggregate completion, rollback claim]
  proof: [garden-term-31 committed at language-r21, second entry remains uncommitted, current language-r22 guard recorded, garden-handbook@handbook-r12 and rota-form@form-r4 retained, aggregate change remains incomplete]
  responsibility: [domain-modeling owns partial-write recovery, workflow retains parent responsibility]
  route: [partial-terminology-write-recovery]
  state: [terminology-change-partially-committed]
  forbidden: [claim the two-entry terminology change complete after only one write]
