  tools: [selected Adapter with native language-record shape, language steward acceptance for proposal p3, API and process artifacts at r9 and r10]
expected:
  actions: [bind mutable artifact locators and revisions, cross-reference the glossary and observed behavior, detect the decisive source advance, invalidate acceptance based on r9, preserve both contexts as proposed or conflicted, return exact resumption action to Workflow]
  artifacts: [source-bound conflict and recovery evidence, continuation action]
  effects: []
  invoked: [thinking-in-systems, workflow, domain-modeling]
  notInvoked: [code edit, architecture decision, canonical Adapter write]
  proof: [proposal p3 remains bound to artifacts-r9, current evidence revision is artifacts-r10, stale acceptance invalidated, both meanings retained, native representation unchanged, exact resumption action]
  responsibility: [workflow retains parent responsibility]
  route: [terminology-conflict-recovery]
  state: [terminology-conflicted-and-waiting-for-current-evidence]
  forbidden: [write the canonical language record from stale decisive evidence]
