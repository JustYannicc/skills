schemaVersion: 1
id: domain-modeling-direct-nontechnical
title: Direct nontechnical terminology request records a shared language
skill: domain-modeling
shape: direct
kind: invocation
domains: [nontechnical]
severity: Critical
requiredAttempts: 3
runtimeReferences: [skills/domain-modeling/references/language-record-template.md]
prompt: >-
  A household calendar uses appointment, event, and commitment interchangeably. The household language owner accepted proposal household-language-p5 from calendar-notes@notes-r14 and family-conversation@conversation-r22: event is any calendar entry, appointment is an event arranged with another Actor, and commitment is an event an Actor has agreed to attend. The current language record is language-r7, and the selected Adapter has no native language-record shape. Record the accepted language without changing the schedule.
environment:
  id: adapter-without-language-shape
  capabilities:
    persistence: true
    conditionalWrite: true
    batchWrite: true
    nativeLanguageRecord: false
    semanticDecisionAuthority: true
    writeAuthority: true
  tools: [selected Adapter at language-r7, household language owner acceptance of proposal household-language-p5, calendar-notes@notes-r14, family-conversation@conversation-r22, disclosed language record template]
expected:
  actions: [identify the terminology question and accepting Authority, read the canonical language record, bind mutable evidence revisions, distinguish labels with boundary scenarios, bind acceptance to the exact proposal revision, adapt the disclosed template, record the accepted entry immediately]
  artifacts: [adapted language entry with meaning, scope, aliases, avoided labels, and conflicts as applicable]
  effects: [shared nontechnical language available to Workflow]
  invoked: [thinking-in-systems, workflow, domain-modeling]
  notInvoked: [schedule change, policy decision, execution]
  proof: [household language owner acceptance of household-language-p5 distinct from write Authority, calendar-notes@notes-r14 and family-conversation@conversation-r22 retained, language-r7 source guard, good case and near-miss scenario, template adapted to the Adapter, Adapter result revision]
  responsibility: [domain-modeling owns terminology evidence, workflow retains parent responsibility]
  route: [workflow-to-domain-modeling]
  state: [terminology-resolved-or-conflict-visible]
  forbidden: ["silently treat appointment, event, and commitment as identical"]
