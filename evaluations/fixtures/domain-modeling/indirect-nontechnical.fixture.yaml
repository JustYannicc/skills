schemaVersion: 1
id: domain-modeling-indirect-nontechnical
title: Workflow routes a nontechnical terminology blocker
skill: domain-modeling
shape: indirect
kind: routing
domains: [nontechnical]
severity: Major
requiredAttempts: 1
prompt: >-
  Workflow is preparing a volunteer meal service, but organizers use shift, slot, and availability inconsistently. The volunteer language steward accepted proposal meal-service-language-p6: shift is an assigned work period; slot is a schedulable interval within service hours; availability is a period in which a volunteer can accept a slot. The acceptance is based on volunteer-handbook@handbook-r5 and signup-form@form-r9. Record the accepted language before assignment.
environment:
  id: adapter-baseline
  capabilities:
    persistence: true
    conditionalWrite: true
    delegation: true
    semanticDecisionAuthority: true
    writeAuthority: true
  tools: [selected Adapter, volunteer language steward acceptance of proposal meal-service-language-p6, volunteer-handbook@handbook-r5, signup-form@form-r9]
expected:
  actions: [classify the blocker as terminology, route to domain-modeling, cross-reference the revision-bound handbook and form, stress-test the labels, bind the steward acceptance to proposal meal-service-language-p6, record the accepted meanings, return bounded language evidence]
  artifacts: [language result with operative meanings or visible conflicts for Workflow]
  effects: [accepted meal-service language recorded]
  invoked: [thinking-in-systems, workflow, domain-modeling]
  notInvoked: [schedule assignment, policy decision, execution]
  proof: [semantic acceptance distinct from write Authority, exact proposal and accepting Actor, volunteer-handbook@handbook-r5 and signup-form@form-r9 retained, accepted terms recorded before assignment, bounded result returned to Workflow]
  responsibility: [workflow integrates the result, domain-modeling owns the bounded language result]
  route: [workflow-to-domain-modeling]
  state: [ready-for-assignment-or-discovery]
  forbidden: [assign volunteers while the terminology blocker remains]
