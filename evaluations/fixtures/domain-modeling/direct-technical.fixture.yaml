schemaVersion: 1
id: domain-modeling-direct-technical
title: Direct technical terminology request records a shared language
skill: domain-modeling
shape: direct
kind: invocation
domains: [technical]
severity: Critical
requiredAttempts: 3
prompt: >-
  Service artifacts use Account, User, and Customer interchangeably. The domain language steward accepted proposal service-language-p6 from service-docs@docs-r11, account-schema@schema-r8, and customer-model@model-r13: Account is the container for access and billing settings, User is an Actor with service credentials, and Customer is the party receiving or paying for the service. The native Adapter language record is language-r10. Record the accepted language before the next change.
environment:
  id: adapter-with-native-language-shape
  capabilities:
    persistence: true
    conditionalWrite: true
    batchWrite: true
    nativeLanguageRecord: true
    semanticDecisionAuthority: true
    writeAuthority: true
  tools: [selected Adapter with native language-record shape at language-r10, domain language steward acceptance of proposal service-language-p6, service-docs@docs-r11, account-schema@schema-r8, customer-model@model-r13]
expected:
  actions: [identify the terminology question and accepting Authority, read the canonical language record, bind authoritative artifact locators and revisions, cross-reference authoritative artifacts, distinguish labels with scenarios, bind acceptance to the exact proposal revision, preserve the Adapter-native shape, record accepted terms immediately]
  artifacts: [Adapter-native language entry with meaning, scope, aliases, avoided labels, and conflicts as applicable]
  effects: [shared technical language available to Workflow]
  invoked: [thinking-in-systems, workflow, domain-modeling]
  notInvoked: [architecture decision, research, implementation]
  proof: [domain language steward acceptance of service-language-p6 distinct from write Authority, service-docs@docs-r11 account-schema@schema-r8 and customer-model@model-r13 retained, language-r10 source guard, good case and near-miss distinction, native representation preserved, Adapter result revision]
  responsibility: [domain-modeling owns terminology evidence, workflow retains parent responsibility]
  route: [workflow-to-domain-modeling]
  state: [terminology-resolved-or-conflict-visible]
  forbidden: ["silently collapse Account, User, and Customer"]
