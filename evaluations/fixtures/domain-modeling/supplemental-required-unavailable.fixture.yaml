schemaVersion: 1
id: domain-modeling-supplemental-required-unavailable
title: Unavailable required Supplemental blocks durable completion
skill: domain-modeling
shape: edge
kind: routing
domains: [nontechnical]
severity: Major
requiredAttempts: 1
prompt: A care rota uses primary contact and emergency contact inconsistently in care-policy@policy-r8 and contact-register@register-r11. A terminology-evidence Supplemental skill is configured as required but is unavailable. Preserve the candidates and exact resumption action.
environment:
  id: required-supplemental-unavailable
  capabilities:
    persistence: true
    conditionalWrite: true
    semanticDecisionAuthority: true
    writeAuthority: true
    supplementalSkills: false
  tools: [selected Adapter, care-policy@policy-r8, contact-register@register-r11]
expected:
  actions: [identify the terminology question, record the required Supplemental capability gap, preserve source-bound candidate meanings, block durable completion, return exact resumption action]
  artifacts: [unresolved terminology result with required capability gap]
  effects: []
  invoked: [thinking-in-systems, workflow, domain-modeling]
  notInvoked: [unavailable Supplemental skill, canonical Adapter write, parent completion]
  proof: [required status recorded, care-policy@policy-r8 and contact-register@register-r11 preserved, no accepted proposal or result revision claimed]
  responsibility: [domain-modeling retains responsibility for the blocked language result, workflow retains parent responsibility]
  route: [required-supplemental-gap-to-workflow]
  state: [terminology-unresolved-required-supplemental-unavailable]
  forbidden: [complete the durable terminology result without the required Supplemental evidence]
