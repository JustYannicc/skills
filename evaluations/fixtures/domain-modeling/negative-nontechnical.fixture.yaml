schemaVersion: 1
id: domain-modeling-negative-nontechnical
title: An unclear responsibility decision with clear terms does not invoke Domain Modeling
skill: domain-modeling
shape: negative
kind: invocation
domains: [nontechnical]
severity: Major
requiredAttempts: 1
prompt: Our community board already defines volunteer, staff member, refund, and approval clearly. Decide whether volunteers or staff members should have Authority to approve refunds.
environment:
  id: policy-decision-with-clear-language
  capabilities:
    persistence: true
    decisionAuthority: false
  tools: []
expected:
  actions: [recognize that the terminology is already operative, classify the blocker as a policy and Authority decision, return the decision gap to Workflow]
  artifacts: [visible policy decision gap]
  effects: []
  invoked: [thinking-in-systems, workflow]
  notInvoked: [domain-modeling, glossary update, policy approval]
  proof: [clear language left unchanged, missing decision Authority remains visible]
  responsibility: [workflow retains parent responsibility]
  route: [workflow-policy-decision-gap]
  state: [waiting-for-authorized-policy-decision]
  forbidden: [invoke Domain Modeling merely because the responsibility boundary is undecided]
