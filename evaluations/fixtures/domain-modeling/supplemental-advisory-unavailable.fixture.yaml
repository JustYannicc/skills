schemaVersion: 1
id: domain-modeling-supplemental-advisory-unavailable
title: Advisory Supplemental failure does not replace the core criterion
skill: domain-modeling
shape: edge
kind: routing
domains: [technical]
severity: Major
requiredAttempts: 1
prompt: >-
  A service uses retry and replay inconsistently. The language steward accepted proposal recovery-language-p5 from recovery-spec@spec-r7 and behavior-trace@trace-r12: retry repeats an operation after an incomplete attempt, while replay resubmits a recorded input. The current native language record is language-r9. A configured terminology-evidence Supplemental skill is advisory but unavailable.
environment:
  id: advisory-supplemental-unavailable-core-sufficient
  capabilities:
    persistence: true
    conditionalWrite: true
    semanticDecisionAuthority: true
    writeAuthority: true
    supplementalSkills: false
  tools: [selected Adapter with native language-record shape at language-r9, language steward acceptance of proposal recovery-language-p5, recovery-spec@spec-r7, behavior-trace@trace-r12]
expected:
  actions: [record the advisory Supplemental capability gap, continue the core procedure, bind decisive source revisions, stress-test retry and replay, bind semantic acceptance to the proposal revision, record the accepted entries]
  artifacts: [Adapter-native language result with advisory gap]
  effects: [shared terminology recorded]
  invoked: [thinking-in-systems, workflow, domain-modeling]
  notInvoked: [unavailable Supplemental skill, implementation, parent completion]
  proof: [advisory failure recorded, recovery-spec@spec-r7 and behavior-trace@trace-r12 retained, core completion criterion independently satisfied, recovery-language-p5 acceptance and Adapter result revisions]
  responsibility: [domain-modeling retains evidence integration and completion responsibility, workflow retains parent responsibility]
  route: [advisory-gap-core-completion]
  state: [terminology-resolved-with-advisory-gap]
  forbidden: [treat the advisory failure as either invisible or a replacement for core evidence]
