schemaVersion: 1
id: prototype-negative-review-request
title: Existing prototype result routes to Review without rerunning Prototype
shape: negative
kind: routing
skill: prototype
domains: [technical]
severity: Critical
requiredAttempts: 3
prompt: "Review this existing Prototype result against the accepted question and return a verdict without rerunning the experiment."
environment:
  id: workflow-with-existing-prototype-result
  capabilities:
    workflow: true
    persistence: true
    sandbox: true
    effects: false
  tools: [review-record]
expected:
  actions: [route the existing result to Review, inspect its accepted question and evidence revision, return the review verdict to Workflow]
  artifacts: [review verdict]
  effects: []
  invoked: [workflow, Review]
  notInvoked: [prototype, to-spec, Specification, implementation, decomposition, parent completion]
  proof: [existing result revision checked at the accepted proof seam without a new experiment]
  responsibility: [Workflow retains parent coordination and completion]
  route: [workflow-to-review-without-prototype]
  state: [review-verdict-ready]
  forbidden: [rerun the experiment, create a new setup, claim parent completion]
