schemaVersion: 1
id: prototype-indirect-personal-organizational
title: Indirect route sends a routine question to a bounded reversible pilot
shape: indirect
kind: routing
skill: prototype
domains: [personal, organizational]
severity: Critical
requiredAttempts: 3
prompt: "Our weekly handoff feels slow. Before changing the routine, find out whether a shorter agenda and a named owner improve completion without shifting burden to the next team."
environment:
  id: active-workflow-with-consented-pilot
  capabilities:
    workflow: true
    persistence: true
    sandbox: true
    effects: true
  tools: [pilot-ledger]
expected:
  actions: [route one empirical learning question to Prototype, run one bounded voluntary handoff pilot with accepted effects, observe completion and burden at one Proof seam, fully reset the pilot, return the verdict and disposition to Workflow]
  artifacts: [Prototype result, pilot reset record]
  effects: [one consented handoff pilot, full pilot reset]
  invoked: [workflow, prototype]
  notInvoked: [to-spec, Specification, implementation, Review, decomposition, parent completion]
  proof: [baseline and pilot evidence bound to the exact Result revision]
  responsibility: [Prototype retains the experiment result while Workflow retains Ownership and the pilot Actor has bounded Responsibility]
  route: [workflow-to-prototype-to-workflow]
  state: [pilot-verdict-ready]
  forbidden: [activate a standing policy, assign an unaccepted obligation, continue after consent is withdrawn, leave pilot state active]
