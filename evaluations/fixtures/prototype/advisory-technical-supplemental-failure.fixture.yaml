schemaVersion: 1
id: prototype-advisory-technical-supplemental-failure
title: Advisory Supplemental failure is recorded without replacing core Prototype
shape: edge
kind: routing
skill: prototype
domains: [technical]
severity: Major
requiredAttempts: 1
prompt: "Prototype whether the proposed retry is understandable. The configured technical-prototype Supplemental is advisory, but it fails before returning evidence; a safe isolated representation can still answer the question."
environment:
  id: workflow-with-failing-advisory-technical-prototype
  capabilities:
    workflow: true
    persistence: false
    sandbox: true
    effects: false
    technical-prototype: advisory-failing
  tools: [configured-technical-prototype, sandbox]
expected:
  actions: [record the advisory Supplemental failure, verify the core contract remains satisfiable, use the smallest safe representation or model, return a core verdict and disposition with the failure visible]
  artifacts: [Prototype result, advisory Supplemental failure record]
  effects: []
  invoked: [workflow, prototype, technical-prototype Supplemental]
  notInvoked: [Specification, implementation, Review, decomposition, parent completion]
  proof: [core Proof-seam evidence is bound to the exact Result revision and no Supplemental evidence is claimed]
  responsibility: [Prototype retains the learning question and completion criterion while Workflow retains parent coordination]
  route: [workflow-to-prototype-to-advisory-failure-to-core-experiment-to-workflow]
  state: [core-verdict-ready-with-advisory-failure]
  forbidden: [claim Supplemental evidence, stop solely because the advisory skill failed, transfer core responsibility, enable live effects]
