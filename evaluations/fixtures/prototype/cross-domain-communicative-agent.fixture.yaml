schemaVersion: 1
id: prototype-cross-domain-communicative-agent
title: Cross-domain rehearsal composes communication and agent boundaries
shape: direct
kind: invocation
skill: prototype
domains: [communicative, agent, personal]
severity: Critical
requiredAttempts: 3
prompt: "Can a private rehearsal with a sandboxed assistant help a person explain a difficult plan without increasing confusion or emotional burden?"
environment:
  id: workflow-private-rehearsal-sandbox
  capabilities:
    workflow: true
    persistence: false
    sandbox: true
    effects: false
  tools: [fake-agent, private-notes]
expected:
  actions: [keep one cross-environment learning question and Proof seam, use a private rehearsal and agent sandbox, observe comprehension and burden, return one verdict and disposition to Workflow]
  artifacts: [cross-environment Prototype result]
  effects: []
  invoked: [workflow, prototype]
  notInvoked: [send message, live agent call, Specification, implementation, Review, decomposition, parent completion]
  proof: [rehearsal transcript and burden observation are bound to the exact Result revision with limits]
  responsibility: [Prototype retains its experiment result while Workflow retains parent coordination and any later communication Authority]
  route: [workflow-to-cross-domain-prototype-to-workflow]
  state: [cross-domain-verdict-ready]
  forbidden: [send the communication, use live credentials, widen to multiple learning questions]
