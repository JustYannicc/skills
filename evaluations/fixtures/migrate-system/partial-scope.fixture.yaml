schemaVersion: 1
id: migrate-system-partial-scope
title: Migration maps only the material slice needed for current work
shape: edge
kind: routing
skill: migrate-system
domains: [software]
severity: Major
requiredAttempts: 1
runtimeReferences: [skills/migrate-system/references/current-state-mapping.md]
prompt: |
  This old commerce workspace has no verified map. I only need to change how refunds are exported; inventory, search, and merchandising are unrelated and can be mapped later. Adopt enough of the existing scope for the refund work to proceed safely.
environment:
  id: partial-commerce-adoption
  capabilities: { persistence: true, baselineAdapter: true, workflow: true, migrateSystem: true, wayfinder: true, delegation: true, coordination: true, continuation: false }
  tools: [selected Adapter with writable Baseline and Coordination, refund records, export interface documentation, refund owner]
expected:
  actions: [join the active Workflow context, define the refund export material boundary and explicit exclusions, map affected sources actors responsibility interfaces active work dependencies evidence waits unknowns and provenance, record truthful unknown coverage outside the affected slice, submit the exact bounded map revision to Review without waiting for unrelated inventory]
  artifacts: [verified refund-export current-state slice, broader-scope coverage gap marked nonblocking]
  effects: [representation and coordination state only]
  invoked: [thinking-in-systems, workflow, migrate-system, review]
  notInvoked: [exhaustive workspace inventory, refund export implementation]
  proof: [Verified Review verdict binds the affected-slice revision, the affected slice is trustworthy enough for ordinary Workflow and unrelated scope is explicitly excluded]
  responsibility: [migration owner verifies the bounded slice, Workflow retains refund-change responsibility]
  route: [partial-conformance-migration, ordinary-workflow-change]
  state: [affected-scope-verified, broader-map-deferred]
  forbidden: [block refund work on unrelated exhaustive mapping, imply excluded systems were verified, complete on Changes required or Inconclusive Review]
