schemaVersion: 1
id: migrate-system-cross-domain-physical
title: Physical and communicative interfaces map without software assumptions
shape: direct
kind: invocation
skill: migrate-system
domains: [physical, communicative]
severity: Major
requiredAttempts: 1
runtimeReferences: [skills/migrate-system/references/current-state-mapping.md]
prompt: |
  Migrate the community theater's set-change operation into Workflow. The current system spans labeled storage, a paper cue sheet, radio calls, volunteer roles, an equipment handoff, and a waiting repair. Map and verify today's operation without changing the stage setup.
environment:
  id: theater-set-change-operation
  capabilities: { persistence: true, baselineAdapter: true, workflow: true, migrateSystem: true, wayfinder: true, delegation: true }
  tools: [selected Adapter, storage observation, cue-sheet revision, radio-call rehearsal observation, volunteer confirmations, repair record]
expected:
  actions: [join the active Workflow context, map physical communicative and human boundaries using the same universal contract, record sources actors responsibilities interfaces active work dependencies evidence waiting unknowns and provenance, verify the handoff and cue seams through observation, preserve the waiting repair as a Continuation, submit the exact cross-domain map revision to Review]
  artifacts: [canonical cross-domain current-state records, derived theater operation map]
  effects: [representation and coordination state only]
  invoked: [thinking-in-systems, workflow, migrate-system, review]
  notInvoked: [software-specific artifact assumptions, stage setup change]
  proof: [Verified Review verdict binds the exact map revision, storage cue radio role handoff and repair state are traceable to exact sources or observations]
  responsibility: [migration owner verifies the integrated operation map, Workflow retains parent Outcome responsibility]
  route: [direct-conformance-migration, workflow-resumption]
  state: [cross-domain-current-state-verified]
  forbidden: [translate the operation into software-only vocabulary, perform the waiting repair or alter the stage setup, complete on Changes required or Inconclusive Review]
