schemaVersion: 1
id: migrate-system-inconclusive-review
title: Inconclusive map Review creates owned waiting instead of completion
shape: edge
kind: composition
skill: migrate-system
domains: [communicative, organizational]
severity: Major
requiredAttempts: 1
runtimeReferences: [skills/migrate-system/references/current-state-mapping.md]
prompt: |
  Adopt our emergency phone-tree operation into Workflow. The integrated map is ready for Review, but the Reviewer cannot verify the overnight handoff because the only current observation is unavailable until tomorrow. Submit the exact map revision and preserve what happens next.
environment:
  id: phone-tree-inconclusive-review
  capabilities: { persistence: true, baselineAdapter: true, workflow: true, migrateSystem: true, wayfinder: true, delegation: false, continuation: true }
  tools: [selected Adapter, exact integrated map phone-tree-current-state@r4, Reviewer, accepted scheduled next observation phone-tree-overnight-observation@2026-08-10T09:00:00+02:00]
expected:
  actions: [join the active Workflow context, submit the exact integrated map revision to Review, record an Inconclusive verdict against that revision, keep migration Responsibility active, create a Continuation with missing overnight evidence owner next check and exact resumption action]
  artifacts: [revision-bound Inconclusive Review record, accepted Continuation]
  effects: [representation and coordination state only]
  invoked: [thinking-in-systems, workflow, migrate-system, review]
  notInvoked: [verified migration completion, phone-tree redesign]
  proof: [the missing evidence and next observation are exact and the map remains non-terminal]
  responsibility: [migration owner owns resumption and changes after Review, Workflow retains parent Outcome responsibility]
  route: [conformance-migration-review, owned-waiting]
  state: [migration-waiting, review-inconclusive]
  forbidden: [treat Inconclusive Review as verified current state, release migration or parent responsibility]
