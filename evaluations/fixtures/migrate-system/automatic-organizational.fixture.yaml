schemaVersion: 1
id: migrate-system-automatic-organizational
title: Workflow automatically maps an unmapped program before changing it
shape: indirect
kind: routing
skill: migrate-system
domains: [organizational]
severity: Critical
requiredAttempts: 3
runtimeReferences: [skills/migrate-system/references/current-state-mapping.md]
prompt: |
  Our volunteer meal program has run for years through shared documents, messages, and people's memory. Several people already own live work, two deliveries are waiting on suppliers, and nobody has a verified current-state map. Add a second approval stage for purchases without disrupting current deliveries.
environment:
  id: existing-unmapped-volunteer-program
  capabilities: { persistence: true, baselineAdapter: true, workflow: true, migrateSystem: true, wayfinder: true, delegation: false, coordination: true, continuation: true }
  tools: [selected Adapter with writable Baseline Coordination and Continuation, shared program records, current owner confirmations]
expected:
  actions: [join the active Workflow context, invoke Migrate System automatically before ordinary change work, bound mapping to the purchase and delivery scope affected by the proposal, inventory actual current state with source-bound provenance, submit the exact integrated map revision to Review, return the second-approval proposal to ordinary Workflow]
  artifacts: [canonical current-state records plus a derived map, separate discovered-change proposal]
  effects: [representation and coordination state only]
  invoked: [thinking-in-systems, workflow, migrate-system, review]
  notInvoked: [separate migration lifecycle, repair or redesign during migration]
  proof: [material owners active work supplier waits authority interfaces and evidence are represented at an exact revision, Verified Review verdict is bound to that exact map revision, requested approval-stage change remains unperformed]
  responsibility: [migration owner integrates and verifies the bounded map, Workflow retains parent Outcome responsibility]
  route: [automatic-conformance-migration, ordinary-workflow-change]
  state: [migration-map-verified, parent-outcome-active]
  forbidden: [perform or approve the second purchase-approval stage during current-state mapping, treat Changes required or Inconclusive Review as a verified map, treat the migration result as parent Outcome completion]
