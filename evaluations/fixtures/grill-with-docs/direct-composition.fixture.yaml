schemaVersion: 1
id: grill-with-docs-direct-composition
title: A direct documented interview reads and updates only confirmed language
shape: direct
kind: composition
skill: grill-with-docs
domains: [software]
severity: Critical
requiredAttempts: 3
prompt: >-
  Grill me with docs on subscription cancellation. Use a fresh ephemeral Adapter
  seeded from evaluations/inputs/grill-with-docs/subscription-records.json. I
  confirm only this glossary decision now: “save window” means the 14 days after
  a cancellation request during which the member may reverse it without
  re-enrollment. Exactly two design decisions remain open: whether service stays
  active throughout that window or ends immediately, and whether any refund is
  automatic or request-based. Notification timing depends on the service choice;
  support permissions depend on the refund choice. Start the documented
  interview but do not resolve or write either open decision.
environment:
  id: subscription-records-ephemeral-adapter
  capabilities:
    grill-with-docs: true
    grilling: true
    domain-modeling: true
    adapter: ephemeral-records
  tools: [ephemeral Adapter read, ephemeral Adapter update, ephemeral Adapter read-back]
expected:
  actions: [read glossary/subscriptions at r1 and decisions/cancellation at r3, update only the confirmed save-window term and read it back at a new revision, ask both and only the two open decisions in the exact Grilling format, defer notification and support questions]
  artifacts: [ephemeral glossary/subscriptions advances from r1 with the confirmed save-window definition, decisions/cancellation remains byte-identical at r3]
  effects: [one confirmed glossary update in the ephemeral Adapter only]
  invoked: [grill-with-docs, grilling, domain-modeling]
  notInvoked: [implementation]
  proof: [real Adapter read-write-read-back events with before and after hashes, every interview question uses the literal Grilling format]
  responsibility: [the requesting context retains responsibility while the interview waits for answers]
  route: [documented-design-interview]
  state: [waiting-for-frontier-answers]
  forbidden: [write an unresolved design decision, mutate decisions/cancellation, claim shared understanding]
