schemaVersion: 1
id: grill-with-docs-edge-missing-domain-modeling
title: Missing Domain Modeling preserves exact documented-design state
shape: edge
kind: composition
skill: grill-with-docs
domains: [organizational-work]
severity: Major
requiredAttempts: 1
prompt: >-
  Grill me with docs on the return-to-office policy using the records seeded by
  evaluations/inputs/grill-with-docs/work-policy-records.json. The selected
  ephemeral Adapter and Grilling are available, but Domain Modeling is not.
  Preserve the exact record locators and unresolved frontier for resumption.
environment:
  id: documented-design-missing-domain-modeling
  capabilities:
    grill-with-docs: true
    grilling: true
    domain-modeling: false
    adapter: ephemeral-records
  tools: [ephemeral Adapter read]
expected:
  actions: [read and identify glossary/work-policy at r4 and decisions/return-to-office at r7, name the missing Domain Modeling capability, preserve the unresolved documented-design frontier and exact resumption condition]
  artifacts: [resumable frontier bound to glossary/work-policy r4 and decisions/return-to-office r7]
  effects: [read the ephemeral records only]
  invoked: [grill-with-docs]
  notInvoked: [unavailable domain-modeling, completed interview]
  proof: [real Adapter reads plus the exact missing capability and record locators support resumption]
  responsibility: [the requesting context retains responsibility for resumption]
  route: [documented-design-degraded]
  state: [waiting-for-domain-modeling-capability]
  forbidden: [silently replace Domain Modeling, write a record, claim shared understanding]
