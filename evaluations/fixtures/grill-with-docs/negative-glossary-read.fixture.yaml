schemaVersion: 1
id: grill-with-docs-negative-glossary-read
title: A supplied glossary definition does not start an interview
shape: negative
kind: invocation
skill: grill-with-docs
domains: [organizational-work]
severity: Major
requiredAttempts: 1
prompt: >-
  Our policy glossary defines “core hours” as 10:00–15:00 local time. What does
  “core hours” mean in that glossary? Do not redesign the policy or interview
  me.
environment:
  id: supplied-glossary-definition
  capabilities:
    grill-with-docs: true
  tools: []
expected:
  actions: [answer that core hours means 10:00–15:00 local time]
  artifacts: []
  effects: []
  invoked: [inline-answer]
  notInvoked: [grill-with-docs, grilling, domain-modeling]
  proof: [the supplied definition is returned without opening a design frontier]
  responsibility: [the requesting user receives the bounded answer]
  route: [inline-glossary-read]
  state: [answered]
  forbidden: [start an interview, modify or invent a record]
