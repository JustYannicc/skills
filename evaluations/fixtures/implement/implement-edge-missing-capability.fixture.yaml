schemaVersion: 1
id: implement-edge-missing-capability
title: Missing required physical capability degrades honestly
shape: edge
kind: routing
skill: implement
domains: [physical]
severity: Major
requiredAttempts: 1
prompt: >-
  Accepted Ticket `panel-cut@t2` requires one acrylic panel cut from approved
  drawing `panel@r7` within a stated tolerance. The workshop lead is Work owner
  and has material-use Authority, but the only qualified cutter and measurement
  gauge are unavailable. Hand tools are explicitly nonconforming. The Result
  and Proof seam cannot be satisfied without those capabilities. Persistence is
  available; scheduling is not. Handle this Implement request without making a
  substitute cut or pretending the Result reached Review.
environment:
  id: workflow-implement-missing-physical-capability
  capabilities:
    workflow: true
    implement: true
    persistence: true
    adapter: true
    qualified-cutter: false
    measurement-gauge: false
    scheduler: false
    review: true
  tools: [selected canonical Adapter]
expected:
  actions: [bind accepted Ticket and required capabilities, enter visible Degraded mode, preserve Accepted state, preserve panel@r7 and safe allowed work, create complete canonical Continuation with capability unblock condition]
  artifacts: [capability-gap Continuation]
  effects: []
  invoked: [workflow, implement]
  notInvoked: [hand-tool substitute, physical cut, Review submission, Review verdict, parent completion]
  proof: [qualified cutter and gauge are named required gaps, drawing and Ticket revisions remain exact, resumption begins with capability and contract revalidation]
  responsibility: [workshop lead retains Ticket Responsibility, Outcome owner retains parent integration and completion]
  route: [workflow-to-implement-to-degraded-admission-gap]
  state: [Accepted, Degraded]
  forbidden: [weaken the tolerance or Proof seam, substitute a nonconforming tool, claim a cut or measurement occurred, submit a ready Result to Review, complete the Ticket or parent Outcome]
