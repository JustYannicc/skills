schemaVersion: 1
id: implement-direct-organizational-physical
title: Physical and organizational work is proven at the observed route
shape: direct
kind: invocation
skill: implement
domains: [physical, organizational]
severity: Major
requiredAttempts: 1
prompt: >-
  Execute accepted Ticket `welcome-route@t3` under Specification
  `community-welcome@s4`. Facilities is the Work owner and may move the two
  freestanding signs and one portable welcome table within the foyer; drilling,
  blocking fire exits, and changing the approved wording are excluded. The
  route-inspection requirement is Complete. The Result is a step-free route
  from the entrance to the staffed welcome table by 08:30. The Proof seam is
  five representative traversals with no obstruction, readable large-print
  directions at both decision points, and a time-stamped observation record.
  The physical Executor, observation capability, canonical Adapter with atomic
  Claims, and Review route are available. Produce the exact observed Result
  and submit it to Review without completing the Ticket or event Outcome.
environment:
  id: workflow-implement-physical-organization
  capabilities:
    workflow: true
    implement: true
    persistence: true
    adapter: true
    atomic-claims: true
    physical-executor: true
    observation: true
    review: true
  tools: [selected canonical Adapter, authorized physical Executor, route observation record, Review submission route]
expected:
  actions: [bind accepted Ticket and physical Authority, claim Ticket, move only authorized freestanding items, observe five traversals, create exact Result revision, submit evidence to Review]
  artifacts: [time-stamped route observation record, revision-bound Review submission]
  effects: [arrange foyer signs and portable welcome table]
  invoked: [workflow, implement, physical Executor]
  notInvoked: [drilling, wording change, Review verdict, parent completion]
  proof: [five unobstructed step-free traversals and both readable decision points bind welcome-route Result revision]
  responsibility: [facilities retains Work-owner Responsibility for the integrated route Result, event lead retains parent integration and terminal proof]
  route: [workflow-to-implement-to-review]
  state: [In review]
  forbidden: [cross the physical Authority boundary, substitute an artifact inspection for route observation, omit the exact physical Result revision, produce a Review verdict, complete the Ticket or parent Outcome]
