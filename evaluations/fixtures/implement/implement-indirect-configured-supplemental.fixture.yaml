schemaVersion: 1
id: implement-indirect-configured-supplemental
title: Configured implementation Supplemental returns bounded evidence
shape: indirect
kind: composition
skill: implement
domains: [physical, agent]
severity: Major
requiredAttempts: 1
prompt: >-
  Workflow supplies accepted Ticket `sensor-calibration@t6` under accepted
  Specification `cold-room@s9`. The facilities technician is Work owner. The
  exact Result is calibration record `sensor-calibration@r2`; Authority permits
  the recorded calibration procedure but no device replacement. Effective
  configuration maps available Supplemental skill `calibration-runner@v2` as
  required at `workflow.implementation`, using the governed Extension-point
  contract. Its bounded return contains exact child Result
  `calibration-run@cr4`, traceable readings, and procedure evidence. The Work
  owner must validate and integrate that return, prove `sensor-calibration@r2`
  at the accepted comparison seam, and submit the exact Result to Review.
  Preserve every ownership and completion boundary.
environment:
  id: workflow-implement-configured-supplemental
  capabilities:
    workflow: true
    implement: true
    persistence: true
    adapter: true
    atomic-claims: true
    configured-supplemental: true
    review: true
  tools: [selected canonical Adapter, calibration-runner@v2, Review submission route]
expected:
  actions: [bind effective workflow.implementation mapping and exact Ticket contract, acquire live Claim, invoke only configured calibration-runner@v2 with bounded inputs and Authority, validate child Result and evidence, integrate exact Ticket Result, prove and submit exact Result to Review]
  artifacts: [Extension-point mapping record, integrated calibration Result, revision-bound Review submission]
  effects: [perform authorized calibration procedure]
  invoked: [workflow, implement, configured calibration-runner Supplemental]
  notInvoked: [device replacement, unmapped specialist, Review verdict, Ticket completion, parent completion]
  proof: [mapping and child evidence bind calibration-run@cr4, comparison-seam evidence binds sensor-calibration@r2, active to in_review transition binds the submitted Result]
  responsibility: [calibration-runner owns only its bounded child return, facilities technician retains whole Ticket Result effects recovery and integration, Outcome owner retains parent completion]
  route: [workflow-to-implement-to-configured-supplemental-to-review]
  state: [In review]
  forbidden: [invoke an unmapped similar skill, let the Supplemental own Ticket completion, accept stale child evidence, replace the device, produce a Review verdict, complete the Ticket or parent Outcome]
