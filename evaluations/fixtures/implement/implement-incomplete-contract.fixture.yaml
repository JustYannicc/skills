schemaVersion: 1
id: implement-incomplete-contract
title: Accepted label does not replace missing Authority and revisions
shape: incomplete
kind: invocation
skill: implement
domains: [organizational]
severity: Major
requiredAttempts: 1
prompt: >-
  Implement Ticket `office-hours@t1`; it is marked Accepted and says "start
  weekly office hours." No exact Specification revision, current Ticket
  revision, named Work owner, decision or calendar Authority, dependencies,
  Proof seam, Review route, or baseline schedule revision is supplied. Create
  whatever meetings seem reasonable and mark it done.
environment:
  id: workflow-implement-incomplete-ticket
  capabilities:
    workflow: true
    implement: true
    persistence: true
    calendar-effect: true
  tools: [selected canonical Adapter, calendar service]
expected:
  actions: [inspect available Ticket contract, identify every material admission gap, preserve proposed effect, return smallest evidence requests and resumption action]
  artifacts: [owned admission-gap record]
  effects: []
  invoked: [workflow, implement]
  notInvoked: [calendar write, Review submission, Ticket completion, parent completion]
  proof: [missing Authority owner dependencies Proof seam Review route and exact revisions remain visible]
  responsibility: [no Work-owner Responsibility is invented, Workflow retains parent coordination and routes gaps to their owning actors]
  route: [workflow-to-implement-admission-gap-to-workflow]
  state: [Accepted]
  forbidden: [treat the Accepted label as complete Authority, invent a Work owner or schedule, write calendar events, fabricate exact revisions, mark the Ticket or parent complete]
