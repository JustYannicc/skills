schemaVersion: 1
id: implement-edge-revision-change
title: Mid-execution revision change blocks stale submission
shape: edge
kind: composition
skill: implement
domains: [software, organizational]
severity: Critical
requiredAttempts: 1
prompt: >-
  Ticket `access-export@t4` began under accepted Specification `access@s6`,
  Ticket revision `t4-r2`, and baseline Result `export@r1`. The Work owner has a
  live matching Claim and completed a candidate `export@r2`. Immediately before
  Review submission, the canonical Ticket reread returns `t4-r3` under
  Specification `access@s7`, removing contractor records from scope and
  changing approval Authority. Candidate `export@r2` still contains contractor
  records and was proved only against s6. Handle the revision change without
  submitting stale evidence, silently editing history, or completing work.
environment:
  id: workflow-implement-mid-execution-revision-change
  capabilities:
    workflow: true
    implement: true
    persistence: true
    adapter: true
    review: true
  tools: [selected canonical Adapter, Review submission route]
expected:
  actions: [reread canonical Ticket before submission, detect Specification and Ticket revision mismatch, preserve export@r2 as historical candidate, stop stale submission, return affected work for impact analysis and correction]
  artifacts: [Workflow material-change record with affected-evidence disposition]
  effects: []
  invoked: [workflow, implement]
  notInvoked: [Review submission, approval reuse, Review verdict, Ticket completion, parent completion]
  proof: [access@s6 t4-r2 and export@r2 remain historical, access@s7 and t4-r3 are current, contractor scope and approval change invalidate affected evidence]
  responsibility: [Work owner retains correction and resubmission Responsibility, Outcome owner retains impact integration and parent proof]
  route: [workflow-to-implement-to-change-impact-to-workflow]
  state: [Accepted]
  forbidden: [submit export@r2 against access@s7, inherit prior approval or evidence, rewrite historical revisions, expose contractor records, complete the Ticket or parent Outcome]
