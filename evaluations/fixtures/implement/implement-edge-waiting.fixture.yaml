schemaVersion: 1
id: implement-edge-waiting
title: External waiting remains owned without false monitoring
shape: edge
kind: routing
skill: implement
domains: [communication, organizational]
severity: Major
requiredAttempts: 1
prompt: >-
  Workflow supplies accepted Ticket `partner-notice@t5`, but its external legal
  approval has not arrived. The notice copy `partner-copy@r3`, Work owner,
  audience, send Authority after approval, and Proof seam are complete; the
  approval is an external dependency and cannot be invented as a Ticket. The
  last check was today at 09:00. The host has persistence but no scheduler or
  monitor. Preserve the exact work and arrange truthful continuation without
  sending, claiming active monitoring, submitting to Review, or completing any
  work.
environment:
  id: workflow-implement-waiting-no-scheduler
  capabilities:
    workflow: true
    implement: true
    persistence: true
    adapter: true
    scheduler: false
    monitor: false
    review: true
  tools: [selected canonical Adapter]
expected:
  actions: [bind current Ticket and external dependency, avoid claiming blocked execution, preserve Accepted state, record last observation, create complete canonical Continuation, name human or next-session resumption trigger]
  artifacts: [Continuation record]
  effects: []
  invoked: [workflow, implement]
  notInvoked: [send effect, scheduler, monitor, Review submission, parent completion]
  proof: [partner-copy@r3 and Ticket revision are preserved, legal approval is the observable unblock condition, first resumption action is reread and revalidate before send]
  responsibility: [notice Work owner retains Responsibility through waiting, external approver is not assigned a fake Ticket, Outcome owner retains parent completion]
  route: [workflow-to-implement-to-waiting]
  state: [Accepted]
  forbidden: [infer legal approval, create an ownerless approval Ticket, claim active monitoring, send or submit the notice, treat waiting as completion]
