schemaVersion: 1
id: workflow-durable-git-without-github
title: Git-backed Local Markdown uses Git for revision but not for missing capabilities
shape: direct
kind: adapter
skill: workflow
domains: [software, personal-work]
severity: Major
requiredAttempts: 1
prompt: |
  Continue this repository's release checklist across sessions. Git is present,
  but there is no GitHub connection and no scheduler. Preserve exact revisions
  and show what remains owned.
environment:
  id: workflow-git-without-github
  capabilities: { persistence: true, localMarkdown: true, git: true, github: false, atomicClaim: false, scheduling: false, workflow: true }
  tools: [git]
expected:
  actions: [select Git-backed Local Markdown as canonical, bind the Git revision as provenance, declare Coordination unavailable without atomic Claim semantics, declare Continuation unavailable, preserve exact Specification and result revisions, keep waiting or Recovery owned]
  artifacts: [canonical Markdown records, Git revision binding, Continuation or Recovery record]
  effects: []
  invoked: [thinking-in-systems, workflow]
  notInvoked: [GitHub API, fictional scheduler, read-then-write concurrency claim]
  proof: [Git provenance is visible while unsupported coordination and scheduling remain visible gaps]
  responsibility: [the parent owner retains responsibility across the session boundary]
  route: [durable-git-backed-local-markdown]
  state: [waiting-or-recovery-with-owned-continuation]
  forbidden: [treat Git presence as GitHub access or safe concurrent claiming]
