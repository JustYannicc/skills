schemaVersion: 1
id: workflow-mid-unrelated-resume
title: Unrelated switch preserves exact continuation and resumes it
shape: edge
kind: routing
skill: workflow
domains: [financial-work, communication]
severity: Critical
requiredAttempts: 3
prompt: |
  Active Outcome O6 reconciles the household budget at ledger revision L8. The current pickup point is checking the electricity entry; no effect or approval is active.
  New message: Unrelated: correct "We recieved it" and return the correction. After that, resume the budget work.
environment:
  id: workflow-unrelated-switch-resume
  capabilities: { activeWorkflowContext: true, persistence: false, workflow: true }
  tools: []
expected:
  actions: [classify the new request as unrelated switch, preserve O6 ledger revision L8 owner pickup point and next action, complete and Review the bounded correction as another Inline Outcome, resume O6 at the electricity entry]
  artifacts: [Inline continuation for O6]
  effects: [corrected sentence returned]
  invoked: [thinking-in-systems, workflow]
  notInvoked: [recursive parent Workflow, durable Adapter]
  proof: [O6 resumes at revision L8 without reconstructed context]
  responsibility: [the O6 owner remains responsible throughout the switch]
  route: [midwork-unrelated-switch-and-resume]
  state: [original-outcome-resumed]
  forbidden: [silently replace O6 or lose its continuation]
