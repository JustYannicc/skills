schemaVersion: 1
id: workflow-delegated-change-propagation
title: Material change propagates only to affected delegated Tickets
shape: edge
kind: routing
skill: workflow
domains: [software, organizational-work]
severity: Critical
requiredAttempts: 3
prompt: |
  Parent Outcome O7 at Specification S5 has delegated Ticket T-A for access rules at result A2 with claim C-A and evidence EA, and T-B for help text at result B4 with claim C-B and evidence EB. Alice owns T-A; Bao owns T-B. Both are active. New approved constraint C2 changes access eligibility but leaves terminology and help content unchanged.
environment:
  id: workflow-delegated-change
  capabilities: { activeWorkflowContext: true, delegation: true, persistence: true, workflow: true }
  tools: []
expected:
  actions: [classify C2 as extension or constraint change, create Specification revision S6 and impact analysis, propagate the exact changed contract to T-A result A2 claim C-A and owner Alice, preserve T-B result B4 claim C-B and evidence EB, re-evaluate parent integration dependencies]
  artifacts: [S5 to S6 change proposal, delegated impact map]
  effects: []
  invoked: [thinking-in-systems, workflow]
  notInvoked: [new parent Workflow, replacement child owner]
  proof: [T-A result A2 and evidence EA are affected while T-B result B4 claim C-B and evidence EB continue unchanged]
  responsibility: [the O7 owner retains parent responsibility and Alice and Bao retain their respective child ownership]
  route: [midwork-delegated-change-propagation]
  state: [affected-child-revised-unaffected-child-active]
  forbidden: [cancel unaffected T-B or transfer parent ownership to a child]
