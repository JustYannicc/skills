schemaVersion: 1
id: workflow-durable-supplemental-extension
title: Supplemental Durable evidence enriches Workflow without replacing it
shape: indirect
kind: composition
skill: workflow
domains: [software, organizational-work]
severity: Major
requiredAttempts: 1
prompt: |
  A configured advisory accessibility reviewer is mapped to the Workflow
  review Extension point for this Durable Outcome. Invoke it with the exact
  Specification and result revision, integrate its evidence, and keep the
  universal Reviewer and parent terminal gate authoritative.
environment:
  id: workflow-durable-supplemental-review
  capabilities: { persistence: true, supplementalSkills: true, supplementalReview: true, workflow: true }
  tools: [supplemental-reviewer]
expected:
  actions: [load the configured Extension mapping, supply exact Specification and result revisions, record Supplemental identity scope and evidence, integrate advisory findings into the core Review, preserve the core completion criterion]
  artifacts: [Extension-point mapping, Supplemental Evidence, integrated Review record]
  effects: []
  invoked: [thinking-in-systems, workflow, configured-supplemental-reviewer]
  notInvoked: [replace universal Review, invoke an unconfigured skill, transfer parent Responsibility]
  proof: [the core Reviewer returns one integrated revision-bound verdict and Workflow retains parent responsibility]
  responsibility: [Workflow remains responsible for integration and parent terminal proof]
  route: [durable-supplemental-review-extension]
  state: [in_review-with-integrated-supplemental-evidence]
  forbidden: [let advisory findings become an independent terminal verdict]
