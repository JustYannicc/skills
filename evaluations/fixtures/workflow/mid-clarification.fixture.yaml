schemaVersion: 1
id: workflow-mid-clarification
title: Mid-work clarification preserves the accepted contract
shape: edge
kind: routing
skill: workflow
domains: [communication]
severity: Major
requiredAttempts: 1
prompt: |
  Active Inline Outcome: rewrite the two-sentence welcome note in a warm tone. Specification revision S1 is accepted and no effect has occurred.
  New message: By "warm" I mean friendly and concise; the audience and requested result are unchanged.
environment:
  id: workflow-mid-clarification
  capabilities: { activeWorkflowContext: true, persistence: false, workflow: true }
  tools: []
expected:
  actions: [classify the message as clarification, attach the clarified meaning to the evidence trail, continue from Specification revision S1]
  artifacts: []
  effects: []
  invoked: [thinking-in-systems, workflow]
  notInvoked: [Specification revision, change proposal, recursive parent Workflow]
  proof: [the Outcome audience scope and proof seam remain unchanged]
  responsibility: [Workflow retains the same parent Outcome owner]
  route: [midwork-clarification]
  state: [active]
  forbidden: [invalidate accepted work or manufacture a scope change]
