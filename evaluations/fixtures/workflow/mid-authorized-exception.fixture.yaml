schemaVersion: 1
id: workflow-mid-authorized-exception
title: Authorized exception compresses one safeguard without disabling Review
shape: edge
kind: routing
skill: workflow
domains: [organizational-work]
severity: Critical
requiredAttempts: 3
prompt: |
  Active Outcome O3 prepares a low-risk internal notice. Policy permits the communications owner to waive the optional second-reader check for one internal draft.
  New message from that owner: Skip the optional second reader for this draft only. I accept the risk of a wording defect; if immediate Review finds ambiguity, restore the check before distribution.
environment:
  id: workflow-authorized-exception
  capabilities: { activeWorkflowContext: true, persistence: false, workflow: true }
  tools: []
expected:
  actions: [classify the message as authorized override or informed exception, verify the stated authority, record the skipped protection consequence scope and recovery trigger, continue with immediate Review]
  artifacts: [proportionate informed-exception record]
  effects: []
  invoked: [thinking-in-systems, workflow]
  notInvoked: [second-reader check, recursive parent Workflow]
  proof: [the exception is bound to this draft and remaining Review stays active]
  responsibility: [Workflow retains parent Outcome responsibility]
  route: [midwork-authorized-exception]
  state: [active-under-exception]
  forbidden: [generalize the exception or disable proof and authority checks]
