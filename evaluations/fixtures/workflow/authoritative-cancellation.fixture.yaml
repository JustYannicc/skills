schemaVersion: 1
id: workflow-authoritative-cancellation
title: Authoritative cancellation disposes every material consequence
shape: edge
kind: routing
skill: workflow
domains: [personal-work]
severity: Major
requiredAttempts: 1
prompt: |
  The authorized Outcome owner cancels relocation Outcome O23. One deposit was already paid, two child Tickets are active, another Outcome requires one of those Tickets, and some collected records must be retained.
environment:
  id: workflow-authoritative-cancellation
  capabilities: { persistence: true, workflow: true, cancellationAuthority: true }
  tools: []
expected:
  actions: [verify cancellation Authority, record rationale and partial effects, dispose every child Ticket, preserve retained evidence, expose dependency consequences, assign recovery or reversal needs, run parent terminal Review]
  artifacts: [cancellation transition with material dispositions]
  effects: []
  invoked: [thinking-in-systems, workflow, review]
  notInvoked: [successor Outcome, fictional reversal]
  proof: [deposit child dependency evidence and recovery dispositions are all explicit]
  responsibility: [the Outcome owner ends responsibility only after authoritative cancellation passes the parent terminal condition]
  route: [authoritative-cancellation]
  state: [cancelled]
  forbidden: [treat cancellation as failure or let cancellation silently satisfy the dependent requirement]
