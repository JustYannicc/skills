schemaVersion: 1
id: workflow-supplemental-review-success
title: Configured advisory Supplemental review enriches the universal verdict
shape: edge
kind: routing
skill: workflow
domains: [physical-environment]
severity: Major
requiredAttempts: 1
prompt: |
  Outcome O20 is at Review for a revised public-room layout. Configuration maps an advisory mobility-access review skill to workflow.review. The specialist reports that the turning clearance at the east entrance is insufficient.
environment:
  id: workflow-supplemental-review-available
  capabilities: { persistence: true, workflow: true, review: true, supplementalReview: true }
  tools: []
expected:
  actions: [invoke the configured Supplemental skill only at workflow.review, provide the exact Specification and result revisions, return the specialist finding to universal Review, integrate it into one core verdict, retain Workflow parent responsibility]
  artifacts: [specialist finding linked as Review evidence]
  effects: []
  invoked: [thinking-in-systems, workflow, configured mobility-access review, review]
  notInvoked: [Supplemental replacement verdict, unrelated Extension point]
  proof: [the universal Review verdict accounts for insufficient turning clearance at the exact reviewed revision]
  responsibility: [the Supplemental reviewer owns its finding while universal Review owns the verdict and Workflow owns parent integration]
  route: [supplemental-review-advisory, universal-review-integration]
  state: [changes-required]
  forbidden: [let the Supplemental skill replace universal Review or complete the parent Outcome]
