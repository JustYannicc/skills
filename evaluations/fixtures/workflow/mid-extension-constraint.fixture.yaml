schemaVersion: 1
id: workflow-mid-extension-constraint
title: Material extension revises only the affected contract slice
shape: edge
kind: routing
skill: workflow
domains: [organizational-work]
severity: Critical
requiredAttempts: 3
prompt: |
  Active Outcome O1 at Specification S3: prepare a staff rota for the weekday desk. Ticket T1 at result W1 covers weekday coverage and is active; Ticket T2 at result C4 covers the already accepted contact sheet and is complete. Review R2 covers C4 only.
  New message: Extend the rota to Saturdays, but leave the contact sheet exactly as approved.
environment:
  id: workflow-mid-extension
  capabilities: { activeWorkflowContext: true, delegation: false, persistence: true, workflow: true }
  tools: []
expected:
  actions: [classify the message as extension or constraint change, append a change proposal and create Specification revision S4, impact-analyze Tickets evidence Review approvals dependencies and legacy state, route Saturday coverage through the required work seam]
  artifacts: [change proposal from S3 to S4, impact analysis]
  effects: []
  invoked: [thinking-in-systems, workflow]
  notInvoked: [separate change-management system, recursive parent Workflow]
  proof: [T1 result W1 is revised for Saturday coverage and T2 result C4 with Review R2 remains valid]
  responsibility: [Workflow retains O1 and every unaffected owner remains responsible]
  route: [midwork-extension-impact-analysis]
  state: [accepted-change-active]
  forbidden: [invalidate unaffected T2 or Review R2 or claim the parent Outcome complete]
