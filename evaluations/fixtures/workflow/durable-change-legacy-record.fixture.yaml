schemaVersion: 1
id: workflow-durable-change-legacy-record
title: Consequential Durable changes use one proportionate Change and Legacy Record
shape: edge
kind: composition
skill: workflow
domains: [organizational-work, software]
severity: Critical
requiredAttempts: 3
prompt: |
  Replace the approval rule for all current and future community applications.
  It changes eligibility, affects volunteers and downstream interfaces, and
  needs a phased rollout. Coordinate the change without creating a separate
  change-management lifecycle.
environment:
  id: workflow-material-change-legacy
  capabilities: { persistence: true, migration: true, phasedRollout: true, rollback: true, actorSupport: true, workflow: true }
  tools: []
expected:
  actions: [classify the request as a material extension or Constraint change, preserve baseline and successor exact revisions, create one Change and Legacy Record, map affected actors interfaces state and legacy cohorts, record Authority readiness support feedback impact timetable pilot rollout abort rollback or repair adoption and sustainment evidence, propagate only affected Tickets and approvals, return the transition to ordinary Workflow]
  artifacts: [Change and Legacy Record, affected-only impact map, phased rollout and rollback or repair evidence]
  effects: []
  invoked: [thinking-in-systems, workflow]
  notInvoked: [separate change-management skill, silent legacy rewrite, unbounded simultaneous rollout]
  proof: [the changed system has a proportionate verified transition packet and unaffected work remains valid]
  responsibility: [the parent Outcome owner retains integration and legacy propagation responsibility]
  route: [durable-material-change, affected-only-propagation, phased-transition]
  state: [change-proposed-awaiting-authority-or-pilot]
  forbidden: [activate the successor before readiness review, legacy disposition, and exact rollback or repair conditions]
