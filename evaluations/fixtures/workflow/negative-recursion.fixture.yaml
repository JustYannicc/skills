schemaVersion: 1
id: workflow-negative-recursion
title: A phase result joins active Workflow without recursive coordination
shape: negative
kind: routing
skill: workflow
domains: [agent-work]
severity: Major
requiredAttempts: 1
prompt: An active Workflow context already owns Outcome O-42. As its terminology child, return the accepted meaning of "ready" and evidence to the parent context.
environment:
  id: workflow-active-child-context
  capabilities: { activeWorkflowContext: true, persistence: false, workflow: true }
  tools: []
expected:
  actions: [join Outcome O-42, preserve the parent identity and return route, return only the bounded terminology result and evidence]
  artifacts: []
  effects: []
  invoked: [workflow]
  notInvoked: [recursive parent Workflow, new Outcome, parent completion]
  proof: [bounded result is returned to Outcome O-42]
  responsibility: [the child owns its result and Workflow retains parent integration responsibility]
  route: [active-context-return]
  state: [child-result-returned]
  forbidden: [start a second parent Outcome or transfer parent ownership]
