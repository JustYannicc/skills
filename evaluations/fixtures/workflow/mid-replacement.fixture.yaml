schemaVersion: 1
id: workflow-mid-replacement
title: Explicit replacement disposes predecessor and child work
shape: edge
kind: routing
skill: workflow
domains: [personal-work]
severity: Critical
requiredAttempts: 3
prompt: |
  Active Outcome O5 is to prepare for a weekend trip. Ticket T1 booked transport and completed with a non-refundable effect; T2 packing is active; T3 restaurant research is accepted.
  New message: Replace this Outcome with staying home this weekend. Stop the trip preparation and preserve what I need to handle the booking.
environment:
  id: workflow-mid-replacement
  capabilities: { activeWorkflowContext: true, persistence: true, workflow: true }
  tools: []
expected:
  actions: [classify the message as explicit replacement or supersession, record the authorized predecessor disposition, dispose T1 T2 and T3 explicitly, preserve the non-refundable effect and recovery need, establish or join the replacement Outcome]
  artifacts: [supersession record, child disposition list, booking recovery continuation]
  effects: []
  invoked: [thinking-in-systems, workflow]
  notInvoked: [silent cancellation, recursive parent Workflow]
  proof: [O5 and every child have an explicit disposition before replacement proceeds]
  responsibility: [the O5 owner retains recovery responsibility until each disposition is terminal or transferred]
  route: [midwork-explicit-replacement]
  state: [predecessor-disposed-replacement-active]
  forbidden: [erase partial effects or abandon active child work]
