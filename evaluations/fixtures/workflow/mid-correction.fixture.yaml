schemaVersion: 1
id: workflow-mid-correction
title: Correction reopens false completion without rewriting history
shape: edge
kind: routing
skill: workflow
domains: [communication]
severity: Critical
requiredAttempts: 3
prompt: |
  Outcome O2 was marked complete after result M4 was reported as sent to the customer group.
  New message: Correction: M4 was sent only to the internal group, so the original customer communication Outcome was not satisfied.
environment:
  id: workflow-mid-correction
  capabilities: { activeWorkflowContext: true, persistence: true, workflow: true }
  tools: []
expected:
  actions: [classify the message as correction, append a correction event, invalidate the false effect evidence, reopen O2 at accepted and route recovery from the failed seam]
  artifacts: [correction event linked to M4]
  effects: []
  invoked: [thinking-in-systems, workflow]
  notInvoked: [new unrelated Outcome, recursive parent Workflow]
  proof: [the earlier completion remains in history and its invalid evidence is explicit]
  responsibility: [the current owner resumes responsibility for O2]
  route: [midwork-correction-recovery]
  state: [accepted-reopened]
  forbidden: [rewrite transition history or leave the reopened Outcome ownerless]
