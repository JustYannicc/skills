schemaVersion: 1
id: workflow-accepted-transfer
title: Accepted Handoff ends outgoing responsibility without completing the Outcome
shape: edge
kind: routing
skill: workflow
domains: [agent-work]
severity: Major
requiredAttempts: 1
prompt: |
  Outcome O22 is active and not complete. Its current owner must leave this environment. A named successor is available and has accepted the exact current state, Authority, revisions, evidence, open risks, and next action.
environment:
  id: workflow-accepted-owner-transfer
  capabilities: { persistence: true, workflow: true, handoff: true }
  tools: []
expected:
  actions: [invoke Handoff, verify successor acceptance of exact continuation state, record an auditable ownership transition, end only the outgoing owner's responsibility]
  artifacts: [accepted Handoff contract linked to O22]
  effects: []
  invoked: [thinking-in-systems, workflow, handoff]
  notInvoked: [parent completion, unaccepted transfer]
  proof: [successor acceptance and exact continuation are visible while O22 remains active]
  responsibility: [the outgoing owner ends responsibility only after the successor accepts it and the successor now owns continuation]
  route: [handoff-accepted-transfer]
  state: [active-with-successor]
  forbidden: [mark O22 complete or leave it ownerless]
