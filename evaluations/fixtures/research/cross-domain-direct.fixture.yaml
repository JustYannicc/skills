schemaVersion: 1
id: research-cross-domain-direct
title: Direct research covers multiple domains with primary evidence
shape: direct
kind: invocation
skill: research
domains: [organizational-work, physical-environment]
severity: Critical
requiredAttempts: 3
prompt: >-
  Investigate whether a community workshop should pilot a shared quiet-hours
  policy using these two available primary records. Physical-setting record
  `workshop-acoustic-survey@rev-2026-07-15` reports 78–84 dBA at the shared
  benches from 18:00–20:00 during powered-tool use and 43–47 dBA in the
  adjacent quiet room. Operating record
  `workshop-booking-ledger@rev-2026-Q2` reports that 65% of member visits occur
  after 18:00 and 31% of after-18:00 bookings list instruction or conversation
  as their primary activity. Cite both record locators, distinguish the facts
  from any policy inference and uncertainty, persist one canonical result
  through the selected Adapter, and return the Adapter identity, durable
  locator, result revision, and persistence status. The selected local-markdown
  Adapter supports create and read-back; create returns an immutable locator
  and result revision. For this fixture it writes to a caller-selected evidence
  path, uses the written file's SHA-256 as the result revision, and reports
  `durable=true` only after a successful read-back. No Workflow context is active.
environment:
  id: direct-primary-cross-domain
  capabilities:
    workflow: false
    research: true
    delegation: false
    persistence: true
    selectedAdapter: local-markdown
  tools: [primary-source records, local-markdown Adapter create/read]
expected:
  actions: [bound the external-fact question, investigate directly, distinguish evidence from inference and uncertainty, persist one canonical research result through the selected Adapter, return its locator revision and durability status to the requesting context]
  artifacts: [Adapter-backed cited cross-domain research result]
  effects: []
  invoked: [research]
  notInvoked: [Specification, execution]
  proof: [each material claim cites a high-trust primary source, cross-domain limits and uncertainty are recorded, the selected Adapter identity durable locator result revision and persistence status are visible]
  responsibility: [return the bounded findings to the requesting user because no Workflow skill context is active]
  route: [direct-research]
  state: [ready-for-requester]
  forbidden: [treat secondary commentary as primary evidence, pretend the Workflow skill is active, return only Inline findings despite the Persistence boundary, claim durability without an Adapter record, continue into Specification or execution]
