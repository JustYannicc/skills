schemaVersion: 1
id: to-spec-indirect
title: Accepted discovery returns through Workflow
shape: indirect
kind: invocation
skill: to-spec
domains: [communication, organizational]
severity: Major
requiredAttempts: 1
prompt: >-
  Workflow has supplied accepted Outcome contract `customer-update-r6` from
  completed discovery. Outcome: the 86 affected members understand that
  Tuesday's class moves from Hall A to Hall C and know the unchanged 18:00 start
  time before Monday 12:00. Good enough means each member receives one plain
  language update through their recorded contact channel, with a telephone
  fallback for the four members who do not use digital messages. Scope is those
  86 members and this venue change; future schedules and transport are
  excluded. The fixed class time, recorded contact Preferences, and privacy
  rule `member-contact-p4` are Constraints from roster revision `roster-r11`,
  high confidence. The membership lead is Outcome owner and Approver; the
  communications coordinator is Specification Work owner and may prepare but
  not send the update in this phase. Proof seam: delivery receipts plus a
  recorded telephone outcome for the four fallback recipients. Terminal
  condition: all 86 have delivery evidence or an accepted recovery disposition.
  Discovery accepted this behavior, no unresolved exception remains, and r6
  grants exact faithful representation. Materialize the Inline Specification
  and return it to Workflow for downstream phases.
environment:
  id: workflow-with-accepted-discovery
  capabilities:
    workflow: true
    persistence: false
    to-spec: true
    research: false
  tools: []
expected:
  actions: [bind accepted Outcome contract, use only accepted discovery decisions, materialize one Specification from the reusable template, return it to Workflow]
  artifacts: [accepted Outcome Specification artifact]
  effects: []
  invoked: [to-spec]
  notInvoked: [to-tickets, implement]
  proof: [customer-update-r6 and exact Specification revision are bound, 86 members Hall C unchanged 18:00 start and Monday 12:00 boundary are preserved, roster-r11 member-contact-p4 and four telephone fallbacks are preserved]
  responsibility: [to-spec owns the bounded Specification result, named Outcome owner retains integration and terminal-proof responsibility, Workflow coordinates the downstream route]
  route: [workflow-to-spec-to-workflow]
  state: [Accepted]
  forbidden: [silently resolve unresolved discovery, send effect]
