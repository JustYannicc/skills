schemaVersion: 1
id: to-spec-supplemental
title: Configured Supplemental evidence enriches without replacing To Spec
shape: edge
kind: invocation
skill: to-spec
domains: [organizational, communication]
severity: Major
requiredAttempts: 1
prompt: >-
  Workflow supplied accepted Outcome contract `visitor-guidance-r5`. Outcome:
  first-time museum visitors can find the ticket desk, quiet room, and exit from
  the entrance without staff intervention. Good enough means a visitor can
  follow three plain-language steps and reach each destination within five
  minutes. Scope is the entrance guidance card for those three destinations;
  exhibit interpretation and building changes are excluded. The current floor
  plan `floor-r9`, approved destination names, and maximum 90-word card are hard
  Constraints with high confidence. Visitor services owns the Outcome and
  approval; the content lead owns the Specification. Authority covers faithful
  Specification materialization and advisory audit, not publishing the card.
  Proof seam: five first-time visitors perform the three wayfinding tasks.
  Terminal condition: all five complete them within five minutes and required
  remediation is verified. No unresolved exception remains; r5 grants exact
  faithful representation. Configuration maps advisory skill
  `plain-language-audit` to `specification-enrichment`. Invoke it through
  Workflow on exact draft `visitor-guidance-spec-d1`; its configured response
  is evidence `audit-r8` that the behavior statements are understandable to
  visitor-services Actors and proposes no change. Record that evidence and
  disposition, materialize the accepted Inline Specification, and return
  downstream work to Workflow.
environment:
  id: workflow-specification-supplemental
  capabilities:
    workflow: true
    persistence: false
    to-spec: true
    supplemental-skills: true
  tools: [configured plain-language-audit skill]
expected:
  actions: [bind accepted Outcome contract, materialize the core Specification, invoke configured Supplemental skill at specification-enrichment, bind Supplemental evidence to exact draft revision, integrate its disposition]
  artifacts: [accepted Inline Outcome Specification artifact, Supplemental evidence record]
  effects: []
  invoked: [to-spec, plain-language-audit]
  notInvoked: [to-tickets, implement]
  proof: [visitor-guidance-r5 exact accepted Specification revision and visitor-guidance-spec-d1 are bound, three destinations five-minute threshold 90-word Constraint and five-visitor Proof seam are preserved, audit-r8 proposes no change]
  responsibility: [to-spec retains the bounded Specification result, Supplemental skill owns only its evidence, named Outcome owner retains integration and terminal-proof responsibility, Workflow coordinates the downstream route]
  route: [workflow-to-spec-supplemental-to-workflow]
  state: [Accepted]
  forbidden: [let Supplemental evidence replace the core Specification, transfer acceptance to the Supplemental skill, claim parent completion]
