schemaVersion: 1
id: to-spec-incomplete-authority
title: Material authority gaps return to discovery
shape: incomplete
kind: invocation
skill: to-spec
domains: [communication, organizational]
severity: Major
requiredAttempts: 1
prompt: >-
  Write the Outcome Specification for an automatic reminder that contacts
  anyone who misses a deadline. The Outcome threshold, owner, Approver,
  recipient and privacy scope, current-system source, and contact authority are
  not supplied. Preserve the request and expose the smallest decisions needed;
  do not invent them or contact anyone.
environment:
  id: workflow-specification-gaps
  capabilities:
    workflow: true
    persistence: false
    to-spec: true
    batch-grill-me: true
    research: true
    to-questionnaire: true
  tools: []
expected:
  actions: [preserve request and state, enumerate material missing decisions, route gaps to batch-grill-me, research, to-questionnaire, and Workflow approval, state exact resumption condition]
  artifacts: [Specification gap record]
  effects: []
  invoked: [to-spec]
  notInvoked: [to-tickets, implement, effect]
  proof: [each gap has an owner or Approver/source and resumption condition]
  responsibility: [to-spec owns the bounded Specification result, Workflow remains responsible while blocked]
  route: [to-spec-to-batch-grill-me, to-spec-to-research, to-spec-to-questionnaire, to-spec-to-workflow-approval]
  state: [Waiting for discovery]
  forbidden: [invent Authority, present accepted Specification, execute effect]
