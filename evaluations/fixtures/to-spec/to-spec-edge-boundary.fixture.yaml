schemaVersion: 1
id: to-spec-edge-boundary
title: Specification returns before decomposition and execution
shape: edge
kind: invocation
skill: to-spec
domains: [physical, organizational]
severity: Major
requiredAttempts: 1
prompt: >-
  Materialize accepted Outcome contract `venue-setup-r4` as one Inline
  Specification artifact. Outcome: Room Cedar is ready for 24 workshop
  participants by 08:30 Friday with 24 chairs in three clear rows, two marked
  wheelchair spaces, an unobstructed 1.2 m aisle, and a working microphone.
  Scope is Room Cedar furniture, access path, and microphone; catering and
  signage outside the room are excluded. Fire-code capacity 26 and the 1.2 m
  aisle are hard Constraints from facilities plan `cedar-v5`, high confidence.
  The venue lead is Outcome owner and Approver; the setup coordinator is
  Specification Work owner. Effect Authority later permits the facilities team
  to move room equipment before 08:30, but this request authorizes no effect.
  Proof seam: venue lead walks the room at 08:20, counts seats and spaces,
  measures the aisle, and hears the microphone check. Terminal condition: all
  four observations pass and required remediation is verified. r4 records the
  accepted decisions, has no unresolved exception, and authorizes its exact
  faithful representation. The request also asks to create Tickets, schedule
  reminders, and perform setup now; return those later phases to Workflow.
environment:
  id: workflow-specification-boundary
  capabilities:
    workflow: true
    persistence: false
    to-spec: true
    to-tickets: true
    implement: true
    scheduler: true
  tools: []
expected:
  actions: [bind accepted Outcome contract, materialize only the Specification artifact, return decomposition/execution to Workflow]
  artifacts: [accepted Outcome Specification artifact]
  effects: []
  invoked: [to-spec]
  notInvoked: [to-tickets, implement, scheduler]
  proof: [venue-setup-r4 and exact Specification revision are bound, 24 chairs two wheelchair spaces 1.2 m aisle and working microphone are preserved, the 08:20 walk-through and later Workflow route are explicit]
  responsibility: [to-spec owns the bounded Specification result, named Outcome owner retains integration and terminal-proof responsibility, Workflow coordinates the downstream route]
  route: [workflow-to-spec]
  state: [Accepted]
  forbidden: [create Tickets, schedule an effect, invent requirements, claim approval]
