schemaVersion: 1
id: to-spec-direct-technical
title: Technical accepted decisions become one universal Specification
shape: direct
kind: invocation
skill: to-spec
domains: [technical, software]
severity: Major
requiredAttempts: 1
prompt: >-
  Materialize accepted Outcome contract `consumer-compat-r9` as one Durable
  Specification artifact. Original request and Intent: keep clients `alpha-2`
  and `beta-4` compatible with the public configuration response at the 09:00
  1 October migration cutover. Good enough means both clients parse required
  fields `mode` and `retryAfterMs`, tolerate the new optional `region` field,
  and receive a response within 250 ms at the accepted Proof seam. Scope is the
  bounded cutover contract query for those two client revisions; client
  upgrades, deployment, and other endpoints are excluded. Compatibility and
  250 ms are hard Constraints accepted from contract suite `compat-e12` at
  revision `e12-r6`, high confidence. The API owner is Outcome owner and
  Approver; the integration lead is Specification Work owner. Authority covers
  faithful Specification persistence only and explicitly excludes deployment
  or client mutation. Terminal condition: both exact clients pass the public
  contract query with no fallback and any affected compatibility record is
  updated. This is a bounded cutover verification, not an Operating Outcome. No
  unresolved exception remains; r9 contains the acceptance grant.
  Workflow selected Durable mode and the canonical Adapter; on a successful
  write it returns locator `outcome:consumer-compat/v1` and exact Adapter
  revision `adapter-r42`. Bind those values and return Implementation to
  Workflow.
environment:
  id: workflow-specification-ready
  capabilities:
    workflow: true
    persistence: true
    adapter: true
    to-spec: true
  tools: [selected canonical Adapter]
expected:
  actions: [bind accepted Outcome contract, materialize one Specification from the reusable template, honor selected Durable mode, bind exact Specification revision]
  artifacts: [accepted durable Outcome Specification artifact]
  effects: []
  invoked: [to-spec]
  notInvoked: [to-tickets, implement]
  proof: [consumer-compat-r9 and exact Specification revision are bound, alpha-2 beta-4 mode retryAfterMs optional region 250 ms and 09:00 1 October cutover are preserved, compat-e12 revision e12-r6 is cited, canonical locator outcome:consumer-compat/v1 and adapter-r42 are recorded]
  responsibility: [to-spec owns the bounded Specification result, named Outcome owner retains integration and terminal-proof responsibility, Workflow coordinates the downstream route]
  route: [workflow-to-spec]
  state: [Accepted]
  forbidden: [invent missing decisions, absorb decomposition or implementation, claim parent completion, claim durable persistence without Adapter evidence]
