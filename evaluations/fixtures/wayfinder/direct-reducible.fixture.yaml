runtimeReferences: [skills/wayfinder/references/map-and-strategy.md, evaluations/fixtures/wayfinder/runtime/direct-reducible-state.md]
prompt: "Use Wayfinder for a multi-session replacement of a community center sign-in process. The accepted destination is that visitors register once without staff re-entry. The team only knows that some unknown part of moving visitor data between the kiosk and the existing roster may block that destination; it cannot yet state the decision question. The kiosk provider publishes integration documentation that is available to inspect. Find the next decision route and preserve the map; do not implement the replacement."
environment:
