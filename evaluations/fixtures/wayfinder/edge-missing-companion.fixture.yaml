    adapterBaseline: true
    grillWithDocs: false
    domainModeling: false
    grilling: true
    research: true
    prototype: true
    toQuestionnaire: true
    scheduling: false
    effects: false
  tools: [adapter]
expected:
  actions: [recognize the terminology blocker in a documented plan, record unavailable Grill With Docs and Domain Modeling as a capability gap, keep the affected frontier item blocked, write the exact companion-availability resumption condition]
  artifacts: [durable Wayfinder Map, Continuation record]
  effects: []
  invoked: [workflow, wayfinder]
  notInvoked: [grill-with-docs, domain-modeling, grilling, research, prototype, to-questionnaire, implementation, parent completion]
  proof: [result revision incident-communications-r4 preserves the blocker owner last observation next check and exact resumption action without claiming a companion result]
  responsibility: [Wayfinder owns the preserved navigation state while Workflow retains the Outcome and the named owner retains the blocked decision]
  route: [workflow-to-wayfinder-degraded-waiting]
  state: [waiting-for-companion-capability]
