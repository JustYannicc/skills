schemaVersion: 1
id: wayfinder-edge-irreducible
title: Irreducible conditions complete through an accepted operating Strategy
shape: edge
kind: routing
skill: wayfinder
domains: [physical, organizational]
severity: Critical
requiredAttempts: 3
runtimeReferences: [skills/wayfinder/references/map-and-strategy.md, evaluations/fixtures/wayfinder/runtime/irreducible-state.md]
prompt: "Use Wayfinder for an outdoor mutual-aid pickup point. The destination, owner, authority, and capacity limit are accepted. Weather and same-day attendance cannot be predicted at worthwhile cost. The team has accepted: open normally below the safe capacity threshold, switch to timed pickup when either weather alert or queue threshold is crossed, pause when neither route is safe, and review after each event. Produce the durable route without pretending those uncertainties can be removed."
environment:
  id: durable-outdoor-operations
  capabilities:
    workflow: true
    persistence: true
    adapterBaseline: true
    adapterCoordination: false
    adapterContinuation: false
    research: true
    domainModeling: true
    grilling: true
    prototype: true
    toQuestionnaire: true
    effects: false
  tools: [adapter, weather-observation]
expected:
  actions: [preserve weather and attendance as irreducible operating fog, record the accepted observations thresholds decision rules safe modes feedback review and recovery, apply the governed-remaining-fog completion gate, return the operating rule to Workflow]
  artifacts: [durable Wayfinder Map, accepted operating Strategy]
  effects: []
  invoked: [workflow, wayfinder]
  notInvoked: [research, domain-modeling, grilling, grill-with-docs, prototype, to-questionnaire, implementation, parent completion]
  proof: [result revision outdoor-pickup-r3 gives every material uncertainty an observable trigger responsible Actor Authority safe mode Evidence source review condition and recovery action]
  responsibility: [Wayfinder owns the strategy result while the Outcome owner and Workflow retain operation and parent completion]
  route: [workflow-to-wayfinder-governed-fog-to-workflow]
  state: [governed-remaining-fog]
  forbidden: [require weather certainty, create speculative Tickets for irreducible fog, imply safe concurrent claiming, claim the parent Outcome complete]
