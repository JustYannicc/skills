schemaVersion: 1
id: wayfinder-indirect-multisession
title: Documented multi-session planning composes through Grill With Docs
shape: indirect
kind: routing
skill: wayfinder
domains: [organizational, communicative]
severity: Critical
requiredAttempts: 3
runtimeReferences: [skills/wayfinder/references/map-and-strategy.md, evaluations/fixtures/wayfinder/runtime/indirect-multisession-state.md]
prompt: "Our written volunteer-coordination plan will take several sessions and two coordinators to sharpen. Its destination and scope are accepted, but the documented role terms conflict and the coordinators still hold decisions about escalation. Preserve the route so either coordinator can resume next week."
environment:
  id: durable-documented-plan
  capabilities:
    workflow: true
    persistence: true
    adapterBaseline: true
    adapterCoordination: true
    adapterContinuation: false
    grillWithDocs: true
    domainModeling: true
    grilling: true
    research: true
    prototype: true
    toQuestionnaire: true
    effects: false
  tools: [adapter, documented-plan]
expected:
  actions: [route persistent multi-session fog to Wayfinder, bind the documented plan and exact Adapter revisions, invoke Grill With Docs for the conflicting terms and coordinator decisions, preserve the resulting decisions frontier blockers and next-session resumption action]
  artifacts: [durable Wayfinder Map, operating Strategy, Continuation record]
  effects: []
  invoked: [workflow, wayfinder, grill-with-docs, grilling, domain-modeling]
  notInvoked: [research, prototype, to-questionnaire, implementation, Specification, parent completion]
  proof: [another coordinator can resume from result revision volunteer-coordination-r9 without reconstructing material context]
  responsibility: [Wayfinder owns the navigation result Grill With Docs owns its bounded composition result and Workflow retains the parent Outcome]
  route: [workflow-to-wayfinder-to-grill-with-docs-to-wayfinder-to-workflow]
  state: [durable-wayfinding-continuation]
  forbidden: [invoke every discovery companion, execute the plan, treat scheduling as completion, duplicate decision detail in the Map]
