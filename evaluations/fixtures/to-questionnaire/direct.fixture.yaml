schemaVersion: 1
id: to-questionnaire-direct
title: Direct request produces a recipient-ready knowledge questionnaire
shape: direct
kind: invocation
skill: to-questionnaire
domains: [communication]
severity: Critical
requiredAttempts: 3
prompt: Create an asynchronous questionnaire for my colleague, the operations lead who owns our approval handoff and knows where and why it stalls. I need the observed causes, affected stages, and authority constraints required to choose a fix, and I need the completed questionnaire ready to send.
environment:
  id: questionnaire-direct-with-file-write
  capabilities:
    modelInvocation: true
    fileWrite: true
    recipientContext: true
  tools: []
expected:
  actions: [identify the recipient role expertise and relationship, elicit the concrete facts or decisions needed back, draft a discovery questionnaire in the required structure, write the questionnaire file, report its path]
  artifacts: [recipient-ready questionnaire]
  effects: []
  invoked: [to-questionnaire]
  notInvoked: [interactive grilling, research, decision work]
  proof: [the questionnaire names its purpose sender recipient and answer use, every requested knowledge gap has a question, the file path is reported]
  responsibility: [to-questionnaire returns the bounded questionnaire result to the Workflow skill]
  route: [direct-to-questionnaire]
  state: [questionnaire-ready]
  forbidden: [answer the missing operational facts itself, research the approval process, make the decision, claim completion without inspecting the questionnaire]
